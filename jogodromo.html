<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogódromo — sua zona de jogos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#3FE0C4;
    --bg2:#17C79E;
    --ink:#08322B;
    --card:#ffffff;
    --coral:#FF6B5B;
    --sun:#FFC93C;
    --sky:#3DA9FC;
    --grape:#9B6DFF;
    --mint:#26D0A0;
    --tangerine:#FF9F45;
    --rose:#FF74B1;
    --shadow: 0 10px 24px rgba(4,40,33,0.18);
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background: radial-gradient(circle at 20% 0%, var(--bg1), var(--bg2) 65%);
    min-height:100vh;
    font-family:'Nunito Sans', sans-serif;
    color:var(--ink);
  }
  h1,h2,h3, .brand, .cardname{font-family:'Baloo 2', sans-serif;}

  /* ---------- Ambient background ---------- */
  .bg-blob{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:.45;
    z-index:0;
    pointer-events:none;
  }
  .bg-blob.b1{width:320px;height:320px;background:var(--sun);top:-90px;left:-70px;animation:drift1 26s ease-in-out infinite alternate;}
  .bg-blob.b2{width:280px;height:280px;background:var(--rose);bottom:-90px;right:-60px;animation:drift2 32s ease-in-out infinite alternate;}
  .bg-blob.b3{width:240px;height:240px;background:#ffffff;top:38%;left:58%;animation:drift3 22s ease-in-out infinite alternate;}
  @keyframes drift1{ from{transform:translate(0,0) scale(1);} to{transform:translate(50px,60px) scale(1.15);} }
  @keyframes drift2{ from{transform:translate(0,0) scale(1);} to{transform:translate(-55px,-45px) scale(1.1);} }
  @keyframes drift3{ from{transform:translate(0,0) scale(1);} to{transform:translate(-35px,45px) scale(1.2);} }

  @media (prefers-reduced-motion: reduce){
    .bg-blob{animation:none !important;}
    .card{animation:none !important;}
    .ttt-cell.pop{animation:none !important;}
    .mem-card.flip, .mem-card.matched{animation:none !important;}
  }

  .app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 16px 60px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .brand{
    display:flex;align-items:center;gap:8px;
    background:var(--card);
    padding:10px 18px 10px 12px;
    border-radius:16px;
    box-shadow:var(--shadow);
    font-weight:800;font-size:1.3rem;
    color:var(--ink);
    white-space:nowrap;
  }
  .brand .dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--coral);
    box-shadow: 18px 0 0 var(--sun), 36px 0 0 var(--sky);
    margin-right:26px;
  }
  .searchwrap{
    flex:1;min-width:180px;
    display:flex;align-items:center;
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:10px 16px;
    gap:10px;
  }
  .searchwrap svg{flex-shrink:0;opacity:.55;}
  .lang-switch{
    background:var(--card);border:none;border-radius:14px;box-shadow:var(--shadow);
    padding:10px 14px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:.85rem;
    color:var(--ink);cursor:pointer;letter-spacing:.5px;
  }
  .lang-menu-bg{
    position:fixed;inset:0;background:rgba(4,26,21,.4);z-index:96;
    display:flex;align-items:flex-start;justify-content:center;padding-top:70px;
  }
  .lang-menu-card{
    background:#eafff8;border-radius:16px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.25);
    width:180px;
  }
  .lang-menu-card button{
    display:block;width:100%;text-align:left;padding:12px 14px;border:none;background:none;
    cursor:pointer;border-radius:10px;font-family:'Baloo 2',sans-serif;font-weight:700;
    font-size:.95rem;color:var(--ink);
  }
  .lang-menu-card button.on{background:var(--mint);color:#fff;}
  .settings-card{width:min(320px,86vw)!important;padding:18px!important;text-align:left;}
  .settings-h3{margin:0 0 12px;font-family:'Baloo 2',sans-serif;color:#08322B;font-size:1.1rem;}
  .settings-desc{font-size:.78rem;color:#527066;line-height:1.4;margin:4px 0 10px;}
  .settings-input{
    width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid #cfe8df;
    font-family:'Nunito Sans',sans-serif;font-size:.9rem;margin-bottom:8px;color:var(--ink);
  }
  .settings-link{display:block;font-size:.78rem;color:var(--mint);font-weight:700;text-decoration:none;}
  .searchwrap input{
    border:none;outline:none;flex:1;
    font-family:'Nunito Sans',sans-serif;
    font-size:1rem;font-weight:600;
    color:var(--ink);background:transparent;
  }
  .searchwrap input::placeholder{color:#8aa39c;}

  .tagline{
    color:#083b30;
    font-weight:700;
    font-size:.95rem;
    opacity:.85;
    margin:2px 4px 16px;
  }

  /* ---------- Category chips ---------- */
  .chips{
    display:flex;gap:10px;flex-wrap:wrap;
    margin-bottom:18px;
  }
  .chip{
    border:none;cursor:pointer;
    padding:9px 18px;
    border-radius:999px;
    background:rgba(255,255,255,.55);
    color:var(--ink);
    font-family:'Baloo 2',sans-serif;
    font-weight:600;font-size:.95rem;
    transition:transform .15s ease, background .15s ease;
  }
  .chip:hover{transform:translateY(-2px);}
  .chip.active{
    background:var(--ink);
    color:#eafff8;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(130px,1fr));
    grid-auto-rows:130px;
    gap:14px;
  }
  .card{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:var(--shadow);
    display:flex;flex-direction:column;
    justify-content:flex-end;
    isolation:isolate;
    background:#0c1f1a;
    transform:translateZ(0);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-4px) scale(1.015);}
  .card:active{transform:translateY(-1px) scale(.99);}
  @keyframes cardIn{
    from{opacity:0; transform:translateY(14px) scale(.96);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .card{animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;}
  .card .art{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
  }
  .card .art svg{width:58%;height:58%;}
  .card .cardname{
    position:relative;z-index:2;
    color:#fff;
    font-size:1rem;
    padding:10px 12px;
    text-shadow:0 2px 6px rgba(0,0,0,.35);
    background:linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,0) 80%);
  }
  .card.soon{cursor:default;filter:grayscale(.15);}
  .card.soon .cardname{opacity:.9;}
  .card .badge{
    position:absolute;top:10px;right:10px;z-index:3;
    background:rgba(255,255,255,.92);
    color:var(--ink);
    font-family:'Baloo 2',sans-serif;
    font-size:.68rem;font-weight:700;
    padding:4px 9px;border-radius:999px;
  }

  .w2{grid-column:span 2;}
  .h2{grid-row:span 2;}
  @media (max-width:520px){
    .w2{grid-column:span 2;}
    .grid{grid-auto-rows:110px;}
  }

  .hidden{display:none !important;}

  /* ---------- Modal ---------- */
  .auth-gate{
    position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#0d3a2b,#04110a);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .auth-gate.hidden{display:none;}
  .auth-card{
    background:#eafff8;border-radius:22px;padding:28px 22px;width:100%;max-width:360px;
    box-shadow:0 16px 40px rgba(0,0,0,.35);
  }
  .auth-brand{
    display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;
    font-size:1.4rem;color:var(--ink);margin-bottom:20px;
  }
  .auth-tabs{display:flex;gap:6px;background:#d7ede4;border-radius:12px;padding:4px;margin-bottom:16px;}
  .auth-tab{
    flex:1;padding:10px;border:none;border-radius:9px;background:none;cursor:pointer;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.9rem;color:#527066;
  }
  .auth-tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .auth-input{
    width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid #cfe8df;
    font-family:'Nunito Sans',sans-serif;font-size:1rem;margin-bottom:10px;color:var(--ink);
  }
  .auth-go{
    width:100%;padding:13px;border:none;border-radius:12px;background:var(--mint);color:#fff;
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;margin-top:4px;
  }
  .auth-go:disabled{opacity:.6;}
  .auth-or{
    display:flex;align-items:center;gap:10px;margin:16px 0;
    color:#8fada2;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.8rem;
  }
  .auth-or::before, .auth-or::after{content:'';flex:1;height:1px;background:#cfe8df;}
  .auth-google{
    width:100%;padding:12px;border:1.5px solid #cfe8df;border-radius:12px;background:#fff;color:var(--ink);
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .auth-error{
    color:#C0392B;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.82rem;
    text-align:center;min-height:1.2em;margin:0 0 8px;
  }
  .account-chip{
    background:var(--card);border-radius:14px;padding:9px 14px;box-shadow:var(--shadow);
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.85rem;color:var(--ink);
    display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;
  }
  .account-chip-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;margin-right:2px;vertical-align:-6px;}
  .profile-card{text-align:center;}
  .profile-avatar-wrap{position:relative;width:92px;height:92px;margin:4px auto 16px;}
  .profile-avatar{
    width:92px;height:92px;border-radius:50%;object-fit:cover;display:block;
    border:3px solid #cfe8df;
  }
  .profile-avatar-blank{
    display:flex;align-items:center;justify-content:center;background:var(--mint);color:#fff;
    font-size:2.2rem;font-weight:800;font-family:'Baloo 2',sans-serif;
  }
  .profile-avatar-edit{
    position:absolute;bottom:-2px;right:-2px;width:32px;height:32px;border-radius:50%;
    background:var(--mint);color:#fff;border:2px solid #fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:.85rem;
  }
  .profile-nick-input{text-align:center;margin-bottom:10px;}
  .profile-cooldown-msg{
    color:#C0392B;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.8rem;
    margin:0 0 10px;
  }
  .profile-logout-btn{
    width:100%;margin-top:10px;padding:10px;border:none;background:none;
    color:#a33;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;
  }
  .profile-bio-input{width:100%;min-height:70px;resize:vertical;font-family:'Nunito Sans',sans-serif;}
  .profile-page{padding:4px 2px 20px;}
  .profile-page-header{text-align:center;padding:10px 0 18px;}
  .profile-page-avatar{
    width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;
    border:3px solid var(--card);box-shadow:var(--shadow);
  }
  .profile-page-avatar.profile-avatar-blank{
    display:flex;align-items:center;justify-content:center;background:var(--mint);color:#fff;
    font-size:1.8rem;font-weight:800;font-family:'Baloo 2',sans-serif;
  }
  .profile-page-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.15rem;color:var(--ink);}
  .profile-page-bio{
    font-size:.85rem;color:#6b8078;margin:4px auto 12px;max-width:280px;cursor:pointer;
    min-height:1.2em;
  }
  .profile-page-edit-btn{
    padding:8px 22px;border-radius:999px;border:1.5px solid #cfe8df;background:#fff;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.82rem;color:var(--ink);cursor:pointer;
  }
  .profile-tabs{
    display:flex;border-top:1.5px solid #e6f2ec;border-bottom:1.5px solid #e6f2ec;margin-bottom:14px;
  }
  .profile-tab{
    flex:1;padding:11px 4px;border:none;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.68rem;color:#8fada2;
    border-bottom:2.5px solid transparent;
  }
  .profile-tab.on{color:var(--mint);border-bottom-color:var(--mint);}
  .profile-tab-content{min-height:160px;}
  .profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .profile-grid .card{aspect-ratio:1;}
  .profile-grid .cardname{font-size:.68rem;}
  .profile-empty{text-align:center;padding:30px 16px;color:#6b8078;}
  .profile-empty p{font-size:.88rem;margin:0 0 16px;}
  .overlay{
    position:fixed;inset:0;
    background:rgba(4,26,21,.72);
    display:flex;align-items:center;justify-content:center;
    padding:16px;z-index:50;
  }
  .modal{
    background:#eafff8;
    border-radius:22px;
    width:100%;max-width:480px;
    max-height:92vh;
    display:flex;flex-direction:column;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    background:var(--card);
  }
  .modal-head h2{margin:0;font-size:1.15rem;}
  .modal-close{
    border:none;background:#f0f0f0;
    width:34px;height:34px;border-radius:50%;
    font-size:1.1rem;cursor:pointer;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .modal-body{
    padding:16px 18px 22px;
    overflow-y:auto;
  }

  /* shared game bits */
  .g-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .g-stat{
    font-family:'Baloo 2',sans-serif;font-weight:700;
    background:#fff;padding:6px 14px;border-radius:12px;
    box-shadow:0 3px 8px rgba(0,0,0,.08);font-size:.95rem;
  }
  .g-btn{
    border:none;cursor:pointer;
    background:var(--ink);color:#eafff8;
    font-family:'Baloo 2',sans-serif;font-weight:600;
    padding:9px 16px;border-radius:12px;font-size:.9rem;
  }
  .g-btn.secondary{background:#fff;color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .g-msg{
    text-align:center;font-family:'Baloo 2',sans-serif;
    font-weight:700;font-size:1.05rem;margin:10px 0;min-height:1.4em;
  }

  /* tic tac toe */
  .ttt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:0 auto;}
  .ttt-cell{
    aspect-ratio:1;background:#fff;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-size:2.2rem;font-weight:800;
    cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.08);
    color:var(--ink);
  }
  .ttt-cell.x{color:var(--sky);}
  .ttt-cell.o{color:var(--coral);}
  @keyframes markPop{
    from{opacity:0; transform:scale(.5);}
    to{opacity:1; transform:scale(1);}
  }
  .ttt-cell.pop{animation:markPop .38s cubic-bezier(.22,1,.36,1) both;}

  /* memory */
  .mem-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:0 auto;}
  .mem-card{
    aspect-ratio:1;border-radius:12px;cursor:pointer;
    background:var(--grape);
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;
    box-shadow:0 3px 8px rgba(0,0,0,.1);
    transition:transform .25s;
  }
  .mem-card.flip{background:#fff;}
  .mem-card.matched{background:#c9f7e8;opacity:.75;cursor:default;}
  .mem-icon{width:60%;height:60%;display:flex;}
  .mem-icon svg{width:100%;height:100%;}
  @keyframes revealCard{
    from{opacity:0; transform:scale(.55) rotateY(90deg);}
    to{opacity:1; transform:scale(1) rotateY(0deg);}
  }
  .mem-card.flip{animation:revealCard .34s ease-out both;}
  @keyframes matchPulse{
    0%{transform:scale(1);}
    45%{transform:scale(1.1);}
    100%{transform:scale(1);}
  }
  .mem-card.matched{animation:matchPulse .42s ease both;}

  /* snake / 2048 canvas containers */
  canvas{display:block;margin:0 auto;background:#08201a;border-radius:14px;touch-action:none;}
  .snake-wrap{display:flex;justify-content:center;}

  /* ---------- setup / difficulty screen ---------- */
  .setup{text-align:center;padding:4px 0 2px;}
  .setup h3{margin:0 0 10px;font-size:1.02rem;}
  .setup .sub{font-size:.82rem;opacity:.7;font-weight:600;margin:0 0 14px;}
  .seg{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap;}
  .seg-btn{
    border:none;cursor:pointer;padding:9px 16px;border-radius:999px;
    background:#ffffff;color:var(--ink);
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:.9rem;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
  }
  .seg-btn.on{background:var(--ink);color:#eafff8;}
  .diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:300px;margin:0 auto;}
  .diff-btn{
    border:none;cursor:pointer;padding:13px 8px;border-radius:16px;color:#ffffff;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;
    box-shadow:0 4px 0 rgba(4,40,33,.22), 0 5px 12px rgba(0,0,0,.12);
    transition:transform .1s ease;
  }
  .diff-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(4,40,33,.22);}
  .diff-btn small{display:block;font-weight:600;font-size:.68rem;opacity:.9;margin-top:2px;}
  .go-btn{
    border:none;cursor:pointer;padding:14px 34px;border-radius:16px;color:#ffffff;
    background:var(--mint);font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1.05rem;
    box-shadow:0 4px 0 rgba(4,40,33,.22), 0 5px 12px rgba(0,0,0,.12);
  }
  .diff-tag{
    display:inline-flex;align-items:center;gap:6px;
    border:none;cursor:pointer;background:rgba(255,255,255,.75);
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.75rem;
    padding:5px 12px;border-radius:999px;color:var(--ink);
  }
  .modal.warm-theme .diff-tag{background:#E3DACB;color:#5a4a35;}

  /* jogo embutido em iframe isolado (tela cheia dentro do modal) */
  .modal.app-embed{
    width:100%;height:92vh;max-width:560px;
    display:flex;flex-direction:column;
  }
  .modal.app-embed .modal-head{flex-shrink:0;}
  .modal.app-embed .modal-body{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .modal.app-embed.iframe-fill .modal-body{
    padding:0;overflow:hidden;
  }
  .app-frame{width:100%;height:100%;border:none;display:block;background:#04110a;}

  /* ---------- criar jogo ---------- */
  .hidden-games-bar{
    text-align:center;padding:10px;margin-top:2px;
    font-family:'Baloo 2',sans-serif;font-weight:600;font-size:.82rem;
    color:#08322B;opacity:.6;cursor:pointer;text-decoration:underline;
  }
  .confirm-bg{
    position:fixed;inset:0;background:rgba(4,26,21,.55);z-index:95;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .confirm-card{
    background:#eafff8;border-radius:18px;padding:22px 20px;max-width:320px;width:100%;
    box-shadow:0 12px 30px rgba(0,0,0,.3);text-align:center;
  }
  .confirm-msg{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;color:#08322B;
    margin:0 0 18px;line-height:1.4;
  }
  .confirm-actions{display:flex;gap:10px;}
  .confirm-actions button{
    flex:1;padding:11px;border-radius:11px;border:none;cursor:pointer;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.9rem;
  }
  .confirm-cancel{background:#fff;color:#08322B;box-shadow:0 2px 6px rgba(0,0,0,.1);}
  .confirm-ok{background:#FF6B5B;color:#fff;}
  .create-tile{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(255,255,255,.35) !important;
    border:2.5px dashed rgba(8,50,43,.35);
  }
  .create-tile .art{position:static;display:flex;align-items:center;justify-content:center;height:60%;}

  /* ---------- on-screen game controls ---------- */
  /* keep boards small enough that the pad stays on screen without scrolling */
  #snakeCanvas{

    border:7px solid #2A6DAC;
    border-radius:14px;
  }

  .pad{
    display:grid;
    grid-template-columns:repeat(3,58px);
    grid-template-rows:repeat(2,52px);
    gap:8px;justify-content:center;
    margin:14px auto 4px;
  }
  .pad-btn{
    border:none;cursor:pointer;
    background:#ffffff;color:var(--ink);
    border-radius:14px;
    font-size:1.25rem;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 0 rgba(4,40,33,.18), 0 4px 10px rgba(0,0,0,.10);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;user-select:none;
    transition:transform .08s ease, background .08s ease;
  }
  .pad-btn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0);background:#dff7ee;}
  .pad-up{grid-column:2;grid-row:1;}
  .pad-left{grid-column:1;grid-row:2;}
  .pad-down{grid-column:2;grid-row:2;}
  .pad-right{grid-column:3;grid-row:2;}
  /* two-button horizontal pad (race / breakout) */
  .pad.pad-lr{grid-template-columns:repeat(2,86px);grid-template-rows:56px;}
  .pad.pad-lr .pad-btn{font-size:1.4rem;}

  }
  .modal.warm-theme .pad-hint{color:#6B615A;}
  @media (max-height:740px){
    .pad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,46px);gap:7px;margin-top:10px;}
    .pad.pad-lr{grid-template-columns:repeat(2,80px);grid-template-rows:50px;}
    .pad-hint{display:none;}
    .g2048-tagline{display:none;}
    .g-msg{margin:6px 0;font-size:.95rem;}
    .modal-body{padding:12px 16px 16px;}
  }

  /* 2048 */
  .modal.warm-theme{background:#F7F5EC;}
  .modal.warm-theme .modal-head{background:#F7F5EC;}
  .g2048-header{display:flex;gap:8px;max-width:320px;margin:0 auto 14px;}
  .g2048-logo{
    flex:0 0 78px;
    background:#E8BB00;color:#ffffff;
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.35rem;
    border-radius:14px;display:flex;align-items:center;justify-content:center;
  }
  .g2048-col{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .g2048-statbox{
    background:#B4A295;border-radius:10px;
    padding:5px 4px 7px;text-align:center;
  }
  .g2048-statbox .label{display:block;font-family:'Baloo 2',sans-serif;font-size:.62rem;font-weight:700;color:#ffffff;letter-spacing:.5px;opacity:.85;}
  .g2048-statbox .value{display:block;font-family:'Baloo 2',sans-serif;font-size:1.3rem;font-weight:800;color:#ffffff;line-height:1.1;}
  .g2048-pillbtn{
    border:none;cursor:pointer;width:100%;
    background:#EA8D4F;color:#ffffff;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.3px;
    padding:7px 4px;border-radius:8px;
  }
  .g2048-tagline{color:#6B615A;font-weight:700;font-size:.85rem;margin:0 0 12px;}
  .g2048-board{
    position:relative;
    max-width:min(320px,40vh);margin:0 auto;background:#B4A295;padding:9px;border-radius:16px;
    touch-action:none;
  }
  .g2048-bg{display:grid;gap:9px;}
  .g2048-cell{
    aspect-ratio:1;border-radius:9px;background:#C6B7AB;
  }
  .g2048-tiles{position:absolute;inset:9px;}
  .g2048-tile{
    position:absolute;top:0;left:0;
    transition:transform .13s ease-in-out;
    will-change:transform;
  }
  .g2048-face{
    width:100%;height:100%;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;font-weight:800;color:#6B615A;
  }
  @keyframes tileAppear{ from{transform:scale(0);opacity:0;} to{transform:scale(1);opacity:1;} }
  @keyframes tileMerge{ 0%{transform:scale(1);} 45%{transform:scale(1.22);} 100%{transform:scale(1);} }
  .g2048-face.appear{animation:tileAppear .16s ease-out both;}
  .g2048-face.merged{animation:tileMerge .22s ease-in-out both;}
  @media (prefers-reduced-motion: reduce){
    .g2048-tile{transition:none;}
    .g2048-face.appear,.g2048-face.merged{animation:none;}
  }

  /* whack a mole */
  .wam-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;}
  .wam-hole{
    aspect-ratio:1;border-radius:50%;
    background:#0c2b23;position:relative;overflow:hidden;
    cursor:pointer;box-shadow:inset 0 6px 10px rgba(0,0,0,.4);
  }
  .wam-hole .mole{
    position:absolute;left:50%;bottom:-100%;
    transform:translateX(-50%);
    width:78%;height:78%;
    transition:bottom .12s ease;
  }
  .wam-hole.up .mole{bottom:2%;animation:moleWobble .32s ease-out;}
  @keyframes moleWobble{
    0%{transform:translateX(-50%) rotate(-7deg) scale(.85);}
    55%{transform:translateX(-50%) rotate(6deg) scale(1.05);}
    100%{transform:translateX(-50%) rotate(0deg) scale(1);}
  }
  .mole svg{width:100%;height:100%;display:block;overflow:visible;}

  /* xadrez — tema madeira */
  .chess-wood{
    background:linear-gradient(160deg,#C89A62,#A97946);
    border-radius:18px;padding:16px 12px 20px;margin:-6px -4px 0;
  }
  .chess-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .chess-title{
    text-align:center;font-family:Georgia,'Times New Roman',serif;font-weight:700;
    font-size:1.5rem;letter-spacing:2px;color:#4a2f18;
    text-shadow:0 1px 0 rgba(255,255,255,.35),0 -1px 0 rgba(0,0,0,.25);
    margin-bottom:4px;
  }
  .chess-topbar{display:flex;gap:8px;width:min(320px,88vw);margin-bottom:4px;}
  .chess-wbtn{
    flex:1;padding:9px 4px;border-radius:9px;text-align:center;cursor:pointer;
    background:linear-gradient(180deg,#D9B37F,#B4824C);
    border:1px solid #7a5127;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 3px rgba(0,0,0,.2);
    color:#4a2f18;font-family:Georgia,serif;font-weight:700;font-size:.72rem;
  }
  .chess-wbtn:active{box-shadow:inset 0 1px 4px rgba(0,0,0,.3);}
  .chess-wbtn.disabled{opacity:.45;pointer-events:none;}
  .chess-board{
    position:relative;
    display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
    width:min(320px,88vw);height:min(320px,88vw);border-radius:6px;overflow:visible;
    box-shadow:0 6px 18px rgba(0,0,0,.28);border:8px solid #5c3a1e;
    background:#5c3a1e;
  }
  .chess-sq{
    position:relative;display:flex;align-items:center;justify-content:center;
    background:#EAD9AE;
  }
  .chess-sq.dark{background:#7A4E2D;}
  .chess-sq.sel{box-shadow:inset 0 0 0 3px #FFC93C;}
  .chess-sq.last{background:#DCC66A;}
  .chess-sq.dark.last{background:#A9862F;}
  .chess-sq.check{background:#E2554A;}
  .chess-sq .dot{
    position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(60,30,10,.4);
  }
  .chess-sq .ring{
    position:absolute;inset:6%;border-radius:50%;border:4px solid rgba(60,30,10,.45);
  }
  .chess-file-label, .chess-rank-label{
    position:absolute;font-size:.55rem;font-weight:700;opacity:.6;font-family:Georgia,serif;
  }
  .chess-file-label{bottom:2px;right:3px;}
  .chess-rank-label{top:2px;left:3px;}
  .chess-pieces-layer{position:absolute;inset:0;pointer-events:none;}
  .chess-piece-el{
    position:absolute;width:12.5%;height:12.5%;
    transition:left .32s cubic-bezier(.34,.06,.24,1), top .32s cubic-bezier(.34,.06,.24,1), opacity .2s;
    display:flex;align-items:center;justify-content:center;
  }
  .chess-piece-el svg{width:80%;height:80%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));transition:transform .2s;}
  .chess-piece-el.removing{opacity:0;}
  .chess-piece-el.removing svg{transform:scale(.3) rotate(35deg);}

  @keyframes kingShake{
    0%,100%{transform:translateX(0) rotate(0);}
    15%{transform:translateX(-8%) rotate(-6deg);}
    30%{transform:translateX(7%) rotate(6deg);}
    45%{transform:translateX(-6%) rotate(-5deg);}
    60%{transform:translateX(6%) rotate(5deg);}
    75%{transform:translateX(-3%) rotate(-2deg);}
  }
  .chess-piece-el svg.king-shake{animation:kingShake .65s ease-in-out;}
  .king-crack-overlay{position:absolute;inset:0;pointer-events:none;transition:opacity .5s ease;z-index:3;}
  .king-crack-overlay.crack-fade{opacity:0;}
  .king-crack-overlay path{stroke-dasharray:140;stroke-dashoffset:140;animation:crackDraw .45s ease-out forwards;}
  .king-crack-overlay path.crack-branch{animation-delay:.18s;}
  @keyframes crackDraw{ to{stroke-dashoffset:0;} }
  .chess-piece-el svg.king-hidden{opacity:0;}
  .chess-king-wedge{position:absolute;inset:0;pointer-events:none;z-index:2;
    animation:wedgeShatter 1.05s cubic-bezier(.3,.2,.3,1) forwards;}
  .chess-king-wedge svg{width:100%;height:100%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));}
  @keyframes wedgeShatter{
    0%,22%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.75);opacity:0;}
  }
  .chess-flash{position:absolute;width:60%;height:60%;left:20%;top:20%;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,220,.95) 0%, rgba(255,200,80,.7) 40%, rgba(255,120,40,0) 75%);
    pointer-events:none;animation:flashPop .55s ease-out forwards;z-index:4;}
  @keyframes flashPop{
    0%{opacity:0;transform:scale(.2);}
    35%{opacity:1;transform:scale(1.4);}
    100%{opacity:0;transform:scale(2.2);}
  }
  .chess-shard{position:absolute;width:22%;height:22%;pointer-events:none;left:39%;top:39%;z-index:5;
    animation:shardFly 1.1s cubic-bezier(.25,.46,.45,.94) forwards;}
  .chess-shard svg{width:100%;height:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));}
  @keyframes shardFly{
    0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;}
    15%{transform:translate(calc(var(--dx) * .2),calc(var(--dy) * .2 - 10px)) rotate(calc(var(--rot) * .3)) scale(1.1);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.3);opacity:0;}
  }
  @keyframes matBoardShake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-1.5%);}
    40%{transform:translateX(1.5%);}
    60%{transform:translateX(-1%);}
    80%{transform:translateX(1%);}
  }
  .chess-board.mate-shake{animation:matBoardShake .4s ease-in-out;}
  @keyframes chessHop{
    0%{transform:translateY(0) scale(1);}
    40%{transform:translateY(-32%) scale(1.1,.94);}
    100%{transform:translateY(0) scale(1);}
  }
  .chess-piece-el.moving svg, .chess-piece-el svg.moving{animation:chessHop .32s cubic-bezier(.3,.1,.3,1);}
  @keyframes chessLand{
    0%{transform:scale(1) scaleY(1);}
    30%{transform:scale(1.16,.86);}
    60%{transform:scale(.94,1.08);}
    100%{transform:scale(1);}
  }
  .chess-piece-el.landing svg, .chess-piece-el svg.landing{animation:chessLand .26s ease-out;}
  @keyframes chessSel{
    0%,100%{box-shadow:inset 0 0 0 3px #FFC93C;}
    50%{box-shadow:inset 0 0 0 3px #FFE9A8;}
  }
  .chess-sq.sel{animation:chessSel 1s ease-in-out infinite;}
  @keyframes chessDot{
    0%,100%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.25);opacity:.7;}
  }
  .chess-sq .dot{animation:chessDot 1.1s ease-in-out infinite;}
  @keyframes chessRing{
    0%,100%{transform:scale(1);opacity:.9;}
    50%{transform:scale(1.08);opacity:.5;}
  }
  .chess-sq .ring{animation:chessRing 1.1s ease-in-out infinite;}
  @keyframes chessCheckPulse{
    0%,100%{background:#E2554A;}
    50%{background:#F4897E;}
  }
  .chess-sq.check{animation:chessCheckPulse .8s ease-in-out infinite;}
  .chess-captured{
    display:flex;justify-content:space-between;width:min(320px,88vw);min-height:26px;
    background:rgba(0,0,0,.12);border-radius:8px;padding:3px 8px;
  }
  .chess-captured .row{display:flex;flex-wrap:wrap;gap:1px;align-items:center;}
  .chess-captured .row svg{width:17px;height:17px;opacity:.85;}
  .chess-status{
    font-family:Georgia,serif;font-weight:700;text-align:center;min-height:1.4em;color:#4a2f18;
  }
  .chess-promo-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:80;
  }
  .chess-promo-card{background:#EAD9AE;border-radius:16px;padding:18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);border:4px solid #5c3a1e;}
  .chess-promo-opts{display:flex;gap:10px;margin-top:12px;}
  .chess-promo-opts button{
    width:52px;height:52px;border-radius:12px;border:1.5px solid #7a5127;background:#D9B37F;cursor:pointer;
  }
  .chess-promo-opts button svg{width:36px;height:36px;}

  /* tela de configuração do xadrez (tema madeira) */
  .chess-setup{
    background:linear-gradient(160deg,#C89A62,#A97946);border-radius:18px;
    padding:22px 18px 20px;text-align:center;
  }
  .chess-setup h2{
    font-family:Georgia,serif;font-weight:700;letter-spacing:3px;color:#4a2f18;
    text-shadow:0 1px 0 rgba(255,255,255,.35);margin:0 0 18px;font-size:1.5rem;
  }
  .chess-setup h4{
    font-family:Georgia,serif;color:#4a2f18;margin:16px 0 10px;font-size:.95rem;letter-spacing:1px;
  }
  .chess-seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .chess-seg button{
    padding:9px 14px;border-radius:9px;border:1px solid #7a5127;cursor:pointer;
    background:linear-gradient(180deg,#D9B37F,#B4824C);color:#4a2f18;
    font-family:Georgia,serif;font-weight:700;font-size:.82rem;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
  }
  .chess-seg button.on{background:linear-gradient(180deg,#5c3a1e,#3a250f);color:#f3e3c4;}
  .chess-color-opt{
    width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#D9B37F,#B4824C);border:1px solid #7a5127;cursor:pointer;
  }
  .chess-color-opt.on{box-shadow:0 0 0 3px #FFC93C;}
  .chess-color-opt svg{width:36px;height:36px;}
  .chess-start-btn{
    margin-top:22px;padding:13px 40px;border-radius:11px;border:1px solid #7a5127;cursor:pointer;
    background:linear-gradient(180deg,#3a250f,#241608);color:#f3e3c4;
    font-family:Georgia,serif;font-weight:700;font-size:1rem;letter-spacing:1px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 6px rgba(0,0,0,.3);
  }

  /* rps */

  .rps-choices{display:flex;justify-content:center;gap:14px;margin:12px 0;}
  .rps-btn{
    width:64px;height:64px;border-radius:50%;
    border:none;cursor:pointer;background:#fff;
    font-size:1.8rem;box-shadow:0 3px 8px rgba(0,0,0,.1);
  }
  .rps-arena{display:flex;justify-content:space-around;align-items:center;margin:14px 0;font-size:2.6rem;}
  .rps-vs{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:1rem;opacity:.6;}

  /* futebol */
  .fut-goal{
    position:relative;height:150px;max-width:260px;margin:10px auto;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 1px, transparent 1px 14px),
      linear-gradient(#dff7ee,#bdece0);
    border:6px solid #ffffff;border-radius:10px;overflow:hidden;
    box-shadow:0 3px 8px rgba(0,0,0,.1);
  }
  .fut-keeper{position:absolute;top:6px;left:50%;transform:translateX(-50%);transition:left .32s cubic-bezier(.22,1,.36,1);}
  .fut-keeper svg{width:56px;height:56px;display:block;}
  .fut-ball{position:absolute;bottom:6%;left:50%;font-size:1.7rem;transform:translateX(-50%);transition:left .45s cubic-bezier(.22,1,.36,1), bottom .45s cubic-bezier(.22,1,.36,1);}
  .fut-kicker{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);}
  .fut-kicker svg{width:60px;height:76px;display:block;}

  /* barrinha de tempo do chute/pulo */
  .timing-holder{max-width:280px;margin:10px auto 0;}
  .timing-track{
    position:relative;height:18px;border-radius:999px;
    background:#e7e2d3;overflow:hidden;margin-bottom:14px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.14);
  }
  .timing-sweet{position:absolute;top:0;bottom:0;background:var(--sun);}
  .timing-perfect{position:absolute;top:0;bottom:0;background:var(--mint);}
  .timing-marker{
    position:absolute;top:-5px;bottom:-5px;width:5px;border-radius:3px;
    background:var(--ink);transform:translateX(-50%);
    box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 2px 5px rgba(0,0,0,.25);
  }
  .timing-go{width:100%;}
  @keyframes kickBounce{
    0%{transform:translateX(-50%) translateY(0) rotate(0deg);}
    30%{transform:translateX(-50%) translateY(-5px) rotate(-6deg);}
    60%{transform:translateX(-50%) translateY(2px) rotate(4deg);}
    100%{transform:translateX(-50%) translateY(0) rotate(0deg);}
  }
  .fut-kicker.kick{animation:kickBounce .45s ease-in-out;}

  .fut-turn-banner{
    text-align:center;font-family:'Baloo 2',sans-serif;font-weight:700;
    padding:9px 14px;border-radius:12px;margin-bottom:10px;font-size:1rem;
  }
  .fut-turn-banner.attack{background:#ffe6bf;color:#7a4a12;}
  .fut-turn-banner.defend{background:#cdeeff;color:#0d4d70;}

  .fut-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .fut-team-btn{
    display:flex;align-items:center;gap:8px;
    border:none;cursor:pointer;text-align:left;
    background:linear-gradient(180deg,#FFD873,#EAA83A);
    color:#5a3a0a;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:.92rem;
    padding:11px 12px;border-radius:999px;
    box-shadow:0 3px 0 #b9800f, 0 4px 8px rgba(0,0,0,.15);
  }
  .fut-team-btn span.flag{font-size:1.3rem;}
  .fut-bracket{text-align:center;}
  .fut-vs-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0;}
  .fut-vs-team{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:'Baloo 2',sans-serif;font-weight:700;}
  .fut-vs-team .flag{font-size:2.4rem;}
  .fut-vs-label{font-family:'Baloo 2',sans-serif;font-weight:700;opacity:.55;font-size:.9rem;}
  .fut-progress{display:flex;justify-content:center;gap:6px;margin:8px 0 16px;}
  .fut-progress span{width:10px;height:10px;border-radius:50%;background:#d8d8d8;}
  .fut-progress span.done{background:var(--mint);}
  .fut-progress span.current{background:var(--tangerine);}

  footer{
    text-align:center;margin-top:30px;
    color:#083b30;opacity:.7;font-size:.85rem;font-weight:600;
  }
</style>
</head>
<body>
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>
<div class="app">

  <div class="topbar">
    <div class="brand"><span class="dot"></span>Jogódromo</div>
    <button class="account-chip hidden" id="accountChip" type="button"></button>
    <button class="lang-switch" id="langSwitch" type="button">PT</button>
    <div class="searchwrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Buscar um jogo..." data-i18n-ph="search_ph">
    </div>
  </div>
  <p class="tagline" data-i18n="tagline">Escolha um jogo e divirta-se — tudo roda direto aqui na página.</p>

  <div class="chips" id="chips">
    <button class="chip active" data-cat="todos" data-i18n="cat_todos">Todos</button>
    <button class="chip" data-cat="classicos" data-i18n="cat_classicos">Clássicos</button>
    <button class="chip" data-cat="puzzle" data-i18n="cat_puzzle">Puzzle</button>
    <button class="chip" data-cat="arcade" data-i18n="cat_arcade">Arcade</button>
    <button class="chip" data-cat="simulacao" data-i18n="cat_simulacao">Simulação</button>
    <button class="chip" data-cat="comunidade" data-i18n="cat_comunidade">Comunidade</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer data-i18n="footer">Feito com carinho — mais jogos chegando em breve ✦</footer>
</div>

<div class="auth-gate hidden" id="authGate">
  <div class="auth-card">
    <div class="auth-brand"><span class="dot"></span>Jogódromo</div>
    <div class="auth-tabs">
      <button class="auth-tab on" data-tab="login" id="authTabLogin" data-i18n="auth_login_tab">Entrar</button>
      <button class="auth-tab" data-tab="signup" id="authTabSignup" data-i18n="auth_signup_tab">Criar conta</button>
    </div>
    <p class="auth-error" id="authError"></p>
    <input class="auth-input" id="authUser" type="email" placeholder="E-mail" data-i18n-ph="auth_username_ph" autocomplete="email">
    <input class="auth-input" id="authPass" type="password" placeholder="Senha" data-i18n-ph="auth_password_ph" autocomplete="current-password">
    <button class="auth-go" id="authGo" data-i18n="auth_login_tab">Entrar</button>

function t(key, vars){
  let s = (I18N[currentLang] && I18N[currentLang][key]) || (I18N.pt && I18N.pt[key]) || key;
  if(vars) for(const k in vars) s = s.replace('{'+k+'}', vars[k]);
  return s;
}
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.dataset.i18nPh); });
  const ls = document.getElementById('langSwitch');
  if(ls) ls.textContent = currentLang.toUpperCase();
}
async function setLang(lang){
  localStorage.setItem(LANG_KEY, lang);
  await syncToServer();
  location.reload();
}
document.addEventListener('DOMContentLoaded', applyStaticI18n);
applyStaticI18n();
document.getElementById('langSwitch').addEventListener('click', ()=>{
  const bg = document.createElement('div');
  bg.className = 'lang-menu-bg';
  bg.innerHTML = `<div class="lang-menu-card">
    <button data-l="pt" class="${currentLang==='pt'?'on':''}">Português</button>
    <button data-l="en" class="${currentLang==='en'?'on':''}">English</button>
    <button data-l="es" class="${currentLang==='es'?'on':''}">Español</button>
  </div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click', e=>{
    if(e.target===bg){ bg.remove(); return; }
    const b = e.target.closest('button'); if(!b) return;
    setLang(b.dataset.l);
  });
});

/* ============================================================
   CONTAS DE USUÁRIO (Firebase) — só ativa quando FIREBASE_CONFIG
   está preenchido. Guarda jogos publicados, rascunhos, jogos
   ocultos e idioma sincronizados na nuvem, pra funcionar em
   qualquer aparelho que a pessoa entrar com a mesma conta.
============================================================ */
const FIREBASE_ENABLED = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && typeof firebase !== 'undefined');
if(FIREBASE_ENABLED){
  try{ firebase.initializeApp(FIREBASE_CONFIG); }
  catch(e){ /* se falhar, o app segue funcionando sem contas */ }
}
function fbAuth(){ return firebase.auth(); }
function fbDb(){ return firebase.firestore(); }
const PROFILE_NICK_KEY = 'jogodromo_nickname';
const PROFILE_AVATAR_KEY = 'jogodromo_avatar';
const PROFILE_UPDATED_KEY = 'jogodromo_profile_updated';
const PROFILE_BIO_KEY = 'jogodromo_bio';
const LIKED_GAMES_KEY = 'jogodromo_liked_games';
const SAVED_GAMES_KEY = 'jogodromo_saved_games';
function loadLikedGames(){ try{ return JSON.parse(localStorage.getItem(LIKED_GAMES_KEY))||[]; }catch(e){ return []; } }
function saveLikedGames(list){ try{ localStorage.setItem(LIKED_GAMES_KEY, JSON.stringify(list)); return true; }catch(e){ return false; } }
function loadSavedGames(){ try{ return JSON.parse(localStorage.getItem(SAVED_GAMES_KEY))||[]; }catch(e){ return []; } }
function saveSavedGames(list){ try{ localStorage.setItem(SAVED_GAMES_KEY, JSON.stringify(list)); return true; }catch(e){ return false; } }
function toggleLikedGame(id){
  const list = loadLikedGames();
  const idx = list.indexOf(id);
  if(idx>=0) list.splice(idx,1); else list.push(id);
  saveLikedGames(list);
  syncToServer();
  return idx<0;
}
function toggleSavedGame(id){
  const list = loadSavedGames();
  const idx = list.indexOf(id);
  if(idx>=0) list.splice(idx,1); else list.push(id);
  saveSavedGames(list);
  syncToServer();
  return idx<0;
}
function collectLocalData(){
  let customGames=[], drafts=[], hiddenGames=[], likedGames=[], savedGames=[];
  try{ customGames = JSON.parse(localStorage.getItem('jogodromo_custom_games')||'[]'); }catch(e){}
  try{ drafts = JSON.parse(localStorage.getItem('jogodromo_drafts')||'[]'); }catch(e){}
  try{ hiddenGames = JSON.parse(localStorage.getItem('jogodromo_hidden_games')||'[]'); }catch(e){}
  try{ likedGames = JSON.parse(localStorage.getItem(LIKED_GAMES_KEY)||'[]'); }catch(e){}
  try{ savedGames = JSON.parse(localStorage.getItem(SAVED_GAMES_KEY)||'[]'); }catch(e){}
  return {
    customGames, drafts, hiddenGames, likedGames, savedGames, lang: localStorage.getItem(LANG_KEY) || 'pt',
    nickname: localStorage.getItem(PROFILE_NICK_KEY) || null,
    avatar: localStorage.getItem(PROFILE_AVATAR_KEY) || null,
    bio: localStorage.getItem(PROFILE_BIO_KEY) || null,
    profileUpdatedAt: localStorage.getItem(PROFILE_UPDATED_KEY) ? Number(localStorage.getItem(PROFILE_UPDATED_KEY)) : null
  };
}
function applyRemoteData(data){
  if(!data) return false;
  const current = collectLocalData();
  if(JSON.stringify(current) === JSON.stringify(data)) return false;
  localStorage.setItem('jogodromo_custom_games', JSON.stringify(data.customGames||[]));
  localStorage.setItem('jogodromo_drafts', JSON.stringify(data.drafts||[]));
  localStorage.setItem('jogodromo_hidden_games', JSON.stringify(data.hiddenGames||[]));
  localStorage.setItem(LIKED_GAMES_KEY, JSON.stringify(data.likedGames||[]));
  localStorage.setItem(SAVED_GAMES_KEY, JSON.stringify(data.savedGames||[]));
  if(data.lang) localStorage.setItem(LANG_KEY, data.lang);
  if(data.nickname) localStorage.setItem(PROFILE_NICK_KEY, data.nickname); else localStorage.removeItem(PROFILE_NICK_KEY);
  if(data.avatar) localStorage.setItem(PROFILE_AVATAR_KEY, data.avatar); else localStorage.removeItem(PROFILE_AVATAR_KEY);
  if(data.bio) localStorage.setItem(PROFILE_BIO_KEY, data.bio); else localStorage.removeItem(PROFILE_BIO_KEY);
  if(data.profileUpdatedAt) localStorage.setItem(PROFILE_UPDATED_KEY, String(data.profileUpdatedAt)); else localStorage.removeItem(PROFILE_UPDATED_KEY);
  return true;
}
async function syncToServer(){
  if(!FIREBASE_ENABLED) return;
  const user = fbAuth().currentUser;
  if(!user) return;
  try{
    await fbDb().collection('userData').doc(user.uid).set(collectLocalData());
  }catch(e){ /* falha silenciosa — a próxima ação tenta sincronizar de novo */ }
}
async function pullFromServer(){
  if(!FIREBASE_ENABLED) return false;
  const user = fbAuth().currentUser;
  if(!user) return false;
  try{
    const doc = await fbDb().collection('userData').doc(user.uid).get();
    return applyRemoteData(doc.exists ? doc.data() : null);
  }catch(e){ return false; }
}
const PROFILE_COOLDOWN_MS = 7*24*60*60*1000;
function getDisplayName(user){
  return localStorage.getItem(PROFILE_NICK_KEY) || user.displayName || user.email || '';
}
function getDisplayAvatar(user){
  return localStorage.getItem(PROFILE_AVATAR_KEY) || user.photoURL || null;
}
function profileCooldownRemaining(){
  const updated = localStorage.getItem(PROFILE_UPDATED_KEY);
  if(!updated) return 0;
  const remaining = PROFILE_COOLDOWN_MS - (Date.now() - Number(updated));
  return remaining > 0 ? remaining : 0;
}
function profileCooldownDays(){
  return Math.max(1, Math.ceil(profileCooldownRemaining() / (24*60*60*1000)));
}
function updateAccountChip(user){

}

function renderProfileTab(tab){
  const content = document.getElementById('profileTabContent');
  if(!content) return;
  content.innerHTML = '';
  if(tab==='drafts'){
    const drafts = loadDrafts().slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    if(!drafts.length){
      content.innerHTML = `<div class="profile-empty"><p>${t('profile_empty_drafts')}</p><button class="g-btn" id="profileEmptyCta">${t('profile_empty_drafts_cta')}</button></div>`;
      content.querySelector('#profileEmptyCta').addEventListener('click', ()=>{ closeModal(); openCreateModal(); });
      return;
    }
    const wrap = document.createElement('div');
    wrap.className = 'chat-list';
    drafts.forEach(d=>{
      const item = document.createElement('div');
      item.className = 'chat-list-item';
      item.innerHTML = `<div class="chat-list-main"><div class="chat-list-name">${chatListEscape(d.name)}</div><div class="chat-list-time">${relativeTimeAgo(d.updatedAt)}</div></div>`;
      item.addEventListener('click', ()=>{
        closeModal();
        openCreateModal();
        setTimeout(()=>{
          document.getElementById('modalCard').classList.add('chat-fill');
          renderGameChat(modalBody, {resumeDraftId:d.id});
        }, 60);
      });
      wrap.appendChild(item);
    });

    return;
  }
  let list = [], emptyKey = '', emptyCtaKey = '', emptyCtaAction = null;

    list = loadCustomGames().map(toRenderableCustomGame);
    emptyKey = 'profile_empty_published'; emptyCtaKey = 'profile_empty_published_cta';
    emptyCtaAction = ()=>{ closeModal(); openCreateModal(); };

    emptyCtaAction = ()=>{ closeModal(); };

    emptyCtaAction = ()=>{ closeModal(); };

function openProfileModal(){
  const user = fbAuth().currentUser;
  if(!user) return;
  const bg = document.createElement('div');
  bg.className = 'confirm-bg';
  const avatar = getDisplayAvatar(user);
  const name = getDisplayName(user);
  const onCooldown = profileCooldownRemaining() > 0;
  const days = profileCooldownDays();
  bg.innerHTML = `
    <div class="confirm-card profile-card">
      <div class="profile-avatar-wrap">
        ${avatar ? `<img src="${avatar}" class="profile-avatar" id="profileAvatarImg">` : `<div class="profile-avatar profile-avatar-blank" id="profileAvatarImg">${chatListEscape(name).charAt(0).toUpperCase()}</div>`}
        ${!onCooldown ? `<button class="profile-avatar-edit" id="profileAvatarBtn">${ICONS.camera}</button>` : ''}
      </div>
      <input type="file" id="profileAvatarInput" accept="image/*" style="display:none;">
      <input type="text" class="auth-input profile-nick-input" id="profileNickInput" value="${chatListEscape(name)}" ${onCooldown ? 'disabled' : ''}>
      ${onCooldown ? `<p class="profile-cooldown-msg">${t('profile_cooldown_msg',{n:days})}</p>` : ''}
      <div class="confirm-actions">
        <button class="confirm-cancel" id="profileClose">${t('menu_cancel')}</button>
        ${!onCooldown ? `<button class="confirm-ok" id="profileSave">${t('profile_save')}</button>` : ''}
      </div>
      <button class="profile-logout-btn" id="profileLogout">${t('auth_logout_btn')}</button>
    </div>
  `;
  document.body.appendChild(bg);
  function close(){ if(bg.parentNode) bg.parentNode.removeChild(bg); }
  bg.addEventListener('click', e=>{ if(e.target===bg) close(); });
  bg.querySelector('#profileClose').addEventListener('click', close);
  bg.querySelector('#profileLogout').addEventListener('click', ()=>{
    close();
    showConfirm(t('auth_logout_confirm',{name}), t('auth_logout_btn'), async ()=>{
      try{ sessionStorage.removeItem('jogodromo_synced'); }catch(e){}
      await fbAuth().signOut();
      location.reload();
    });
  });
  let pendingAvatar = null;
  const avatarBtn = bg.querySelector('#profileAvatarBtn');
  if(avatarBtn){
    const avatarInput = bg.querySelector('#profileAvatarInput');
    avatarBtn.addEventListener('click', ()=>avatarInput.click());
    avatarInput.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=>{
          const size = 240;
          const scale = Math.max(size/img.width, size/img.height);
          const w = img.width*scale, h = img.height*scale;
          const c = document.createElement('canvas');
          c.width = size; c.height = size;
          c.getContext('2d').drawImage(img, (size-w)/2, (size-h)/2, w, h);
          pendingAvatar = c.toDataURL('image/jpeg', 0.85);
          const imgEl = bg.querySelector('#profileAvatarImg');
          if(imgEl.tagName==='IMG') imgEl.src = pendingAvatar;
          else imgEl.outerHTML = `<img src="${pendingAvatar}" class="profile-avatar" id="profileAvatarImg">`;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
  const saveBtn = bg.querySelector('#profileSave');
  if(saveBtn){
    saveBtn.addEventListener('click', ()=>{
      const newNick = bg.querySelector('#profileNickInput').value.trim();
      const changed = !!pendingAvatar || (newNick && newNick !== name);
      if(!changed){ close(); return; }
      if(newNick) localStorage.setItem(PROFILE_NICK_KEY, newNick);
      if(pendingAvatar) localStorage.setItem(PROFILE_AVATAR_KEY, pendingAvatar);
      localStorage.setItem(PROFILE_UPDATED_KEY, String(Date.now()));
      syncToServer();
      close();
      updateAccountChip(user);
      if(document.querySelector('.profile-page')) openProfilePage();
      showInfo(t('profile_cooldown_msg',{n:7}));
    });
  }
}
function firebaseErrorMessage(err){
  const map = {
    'auth/wrong-password': t('auth_error_wrong_password'),
    'auth/invalid-credential': t('auth_error_wrong_password'),
    'auth/user-not-found': t('auth_error_wrong_password'),
    'auth/email-already-in-use': t('auth_error_email_in_use'),
    'auth/invalid-email': t('auth_error_invalid_email'),
    'auth/weak-password': t('auth_error_weak_password'),
    'auth/popup-closed-by-user': t('auth_error_popup_closed'),
  };
  return map[err.code] || err.message || t('auth_error_generic');
}
let authMode = 'login';
function renderAuthForm(){
  const tabLogin = document.getElementById('authTabLogin');
  const tabSignup = document.getElementById('authTabSignup');
  const goBtn = document.getElementById('authGo');
  const googleBtn = document.getElementById('authGoogle');
  const errEl = document.getElementById('authError');
  function setMode(m){
    authMode = m;
    tabLogin.classList.toggle('on', m==='login');
    tabSignup.classList.toggle('on', m==='signup');
    goBtn.textContent = m==='login' ? t('auth_login_tab') : t('auth_signup_tab');
    errEl.textContent = '';
  }
  tabLogin.addEventListener('click', ()=>setMode('login'));
  tabSignup.addEventListener('click', ()=>setMode('signup'));
  goBtn.addEventListener('click', async ()=>{
    const email = document.getElementById('authUser').value.trim();
    const password = document.getElementById('authPass').value;
    errEl.textContent = '';
    if(!email || !password){ errEl.textContent = t('auth_fill_both'); return; }
    goBtn.disabled = true;
    try{
      if(authMode==='signup'){
        await fbAuth().createUserWithEmailAndPassword(email, password);
        await syncToServer();
      } else {
        await fbAuth().signInWithEmailAndPassword(email, password);
        await pullFromServer();
      }
      try{ sessionStorage.setItem('jogodromo_synced','1'); }catch(e){}
      location.reload();
    }catch(e){
      errEl.textContent = firebaseErrorMessage(e);
      goBtn.disabled = false;
    }
  });
  googleBtn.addEventListener('click', async ()=>{
    errEl.textContent = '';
    googleBtn.disabled = true;
    try{
      const result = await fbAuth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
      if(result.additionalUserInfo && result.additionalUserInfo.isNewUser) await syncToServer();
      else await pullFromServer();
      try{ sessionStorage.setItem('jogodromo_synced','1'); }catch(e){}
      location.reload();
    }catch(e){
      errEl.textContent = firebaseErrorMessage(e);
      googleBtn.disabled = false;
    }
  });
  setMode('login');
}
async function initAuth(){
  const gate = document.getElementById('authGate');
  const chip = document.getElementById('accountChip');
  if(!FIREBASE_ENABLED){ gate.classList.add('hidden'); return; }
  renderAuthForm();
  fbAuth().onAuthStateChanged(async user=>{
    if(!user){
      gate.classList.remove('hidden');
      chip.classList.add('hidden');
      return;
    }
    gate.classList.add('hidden');
    chip.classList.remove('hidden');
    updateAccountChip(user);
    chip.onclick = openProfilePage;
    let alreadySynced = false;
    try{ alreadySynced = !!sessionStorage.getItem('jogodromo_synced'); }catch(e){}
    if(!alreadySynced){
      try{ sessionStorage.setItem('jogodromo_synced','1'); }catch(e){}
      const changed = await pullFromServer();
      if(changed){ location.reload(); }
    }
  });
}
initAuth();

function saveDrafts(list){
  try{ localStorage.setItem(DRAFTS_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
function slugifyCat(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'comunidade';
}
function toRenderableCustomGame(rec){
  const cat = rec.category ? slugifyCat(rec.category) : 'comunidade';
  return {
    id: rec.id, name: rec.name, cat, catLabel: rec.category || null, span:'',
    bg: rec.bg, cover: rec.cover || null,
    custom:true, playable:true, codeB64: rec.codeB64,
    hasDifficulty: !!rec.hasDifficulty,
    multiplayerCounts: rec.multiplayerCounts || []
  };
}
const HIDDEN_GAMES_KEY = 'jogodromo_hidden_games';
function loadHiddenGames(){
  try{ return JSON.parse(localStorage.getItem(HIDDEN_GAMES_KEY)) || []; }
  catch(e){ return []; }
}
function saveHiddenGames(list){
  try{ localStorage.setItem(HIDDEN_GAMES_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
GAMES = GAMES.concat(loadCustomGames().map(toRenderableCustomGame));
let hiddenGameIds = loadHiddenGames();
GAMES = GAMES.filter(g=>!hiddenGameIds.includes(g.id));
renderDynamicCategoryChips();

/* ============================================================
   RENDER GRID
============================================================ */
const grid = document.getElementById('grid');
function createTileEl(){
  const el = document.createElement('div');
  el.className = 'card create-tile';
  el.innerHTML = `<div class="art"><span class="create-plus">＋</span></div><div class="cardname">${t('create_tile')}</div>`;
  el.addEventListener('click', openCreateModal);
  return el;
}
function createGameCardEl(g, i){
  const el = document.createElement('div');
  el.className = 'card ' + g.span + (g.playable? '' : ' soon');
  el.style.background = g.bg;
  if(i!==undefined) el.style.animationDelay = Math.min((i+1)*45, 400)+'ms';
  const artHtml = g.cover
    ? `<img src="${g.cover}" alt="" style="width:100%;height:100%;object-fit:cover;">`
    : (g.icon ? g.icon() : `<span class="fallback-glyph">${(g.name||'?').trim().charAt(0).toUpperCase()}</span>`);
  el.innerHTML = `
    <div class="art">${artHtml}</div>
    ${g.playable ? '' : `<span class="badge">${t('soon_badge')}</span>`}
    <div class="cardname">${g.name}</div>
  `;
  if(g.playable){
    let pressTimer = null;
    let longPressed = false;
    el.addEventListener('pointerdown', ()=>{
      longPressed = false;
      clearTimeout(pressTimer);
      el.classList.add('pressing');
      pressTimer = setTimeout(()=>{
        longPressed = true;
        el.classList.remove('pressing');
        openGameMenu(g);
      }, 480);
    });
    const cancelPress = ()=>{ clearTimeout(pressTimer); el.classList.remove('pressing'); };
    el.addEventListener('pointerup', cancelPress);
    el.addEventListener('pointerleave', cancelPress);
    el.addEventListener('pointercancel', cancelPress);
    el.addEventListener('click', e=>{
      if(longPressed){ longPressed=false; e.preventDefault(); e.stopPropagation(); return; }
      openGame(g.id, g.name);
    });
  } else {
    el.addEventListener('click', ()=>toast(t('soon_toast')));
  }
  return el;
}
function renderGrid(list){
  grid.innerHTML = '';
  grid.appendChild(createTileEl());
  list.forEach((g,i)=>{
    grid.appendChild(createGameCardEl(g, i));
  });
  renderHiddenLink();
}
renderGrid(GAMES);

/* menu de ações (segurar um card) — estilo folha de ações do iOS */
function openGameMenu(g){
  const bg = document.createElement('div');
  bg.className = 'game-menu-bg';
  const isLiked = loadLikedGames().includes(g.id);
  const isSaved = loadSavedGames().includes(g.id);
  const items = [];
  items.push(`<button class="game-menu-item" data-act="like">${isLiked ? ICONS.heartFilled : ICONS.heartOutline} ${isLiked ? t('menu_unlike') : t('menu_like')}</button>`);
  items.push(`<button class="game-menu-item" data-act="save">${isSaved ? ICONS.bookmarkFilled : ICONS.bookmarkOutline} ${isSaved ? t('menu_unsave') : t('menu_save')}</button>`);
  if(g.custom){
    items.push(`<button class="game-menu-item" data-act="edit">${ICONS.pencil} ${t('menu_edit')}</button>`);
    items.push(`<button class="game-menu-item" data-act="agent">${ICONS.gamepad} ${t('menu_agent')}</button>`);
  }
  items.push(`<button class="game-menu-item danger" data-act="remove">${ICONS.trash} ${t('menu_remove')}</button>`);
  bg.innerHTML = `
    <div class="game-menu-sheet">
      <div class="game-menu-title">${g.name}</div>
      ${items.join('')}
      <button class="game-menu-cancel">${t('menu_cancel')}</button>
    </div>
  `;
  document.body.appendChild(bg);
  requestAnimationFrame(()=>bg.classList.add('show'));
  function close(){
    bg.classList.remove('show');
    setTimeout(()=>{ if(bg.parentNode) bg.parentNode.removeChild(bg); }, 200);
  }
  bg.addEventListener('click', e=>{ if(e.target===bg) close(); });
  bg.querySelector('.game-menu-cancel').addEventListener('click', close);
  bg.querySelector('[data-act="like"]').addEventListener('click', ()=>{
    const nowLiked = toggleLikedGame(g.id);
    close();
    toast(nowLiked ? t('liked_toast',{name:g.name}) : t('unliked_toast',{name:g.name}));
  });
  bg.querySelector('[data-act="save"]').addEventListener('click', ()=>{
    const nowSaved = toggleSavedGame(g.id);
    close();
    toast(nowSaved ? t('saved_toast',{name:g.name}) : t('unsaved_toast',{name:g.name}));
  });
  const editBtn = bg.querySelector('[data-act="edit"]');
  if(editBtn) editBtn.addEventListener('click', ()=>{ close(); openEditGame(g); });
  const agentBtn = bg.querySelector('[data-act="agent"]');
  if(agentBtn) agentBtn.addEventListener('click', ()=>{ close(); openAdjustWithAgent(g); });
  bg.querySelector('[data-act="remove"]').addEventListener('click', ()=>{
    close();
    showConfirm(t('remove_confirm_msg',{name:g.name}), t('remove_confirm_btn'), ()=>{
      if(g.custom) removeCustomGame(g.id);
      else hideBuiltinGame(g.id, g.name);
    });
  });
}
function openAdjustWithAgent(g){
  modalTitle.textContent = t('create_title');
  modalBody.innerHTML = '';
  overlay.classList.remove('hidden');
  document.getElementById('modalCard').classList.remove('warm-theme', 'iframe-fill');
  document.getElementById('modalCard').classList.add('app-embed', 'arcade-theme', 'chat-fill');
  renderGameChat(modalBody, {name:g.name, code:b64ToUtf8(g.codeB64), editingId:g.id});
  activeCleanup = ()=>{};
}
function openEditGame(g){
  modalTitle.textContent = t('edit_title');
  modalBody.innerHTML = '';
  overlay.classList.remove('hidden');
  document.getElementById('modalCard').classList.remove('warm-theme', 'iframe-fill', 'chat-fill');
  document.getElementById('modalCard').classList.add('app-embed', 'arcade-theme');

function removeCustomGame(id){
  saveCustomGames(loadCustomGames().filter(r=>r.id!==id));
  GAMES = GAMES.filter(g=>g.id!==id);
  renderDynamicCategoryChips();
  const activeCat = document.querySelector('.chip.active').dataset.cat;
  applyFilters(activeCat, document.getElementById('search').value);
  toast(t('removed_custom_toast'));
  syncToServer();
}
function hideBuiltinGame(id, name){
  hiddenGameIds = loadHiddenGames();
  if(!hiddenGameIds.includes(id)) hiddenGameIds.push(id);
  saveHiddenGames(hiddenGameIds);
  GAMES = GAMES.filter(g=>g.id!==id);
  const activeCat = document.querySelector('.chip.active').dataset.cat;
  applyFilters(activeCat, document.getElementById('search').value);
  toast(t('removed_toast',{name}));
  syncToServer();
}
function renderDynamicCategoryChips(){
  const FIXED_CATS = ['todos','classicos','puzzle','arcade','simulacao','comunidade'];
  const chipsEl = document.getElementById('chips');
  const activeChipBefore = chipsEl.querySelector('.chip.active');
  const activeCatBefore = activeChipBefore ? activeChipBefore.dataset.cat : 'todos';
  chipsEl.querySelectorAll('.chip-dynamic').forEach(c=>c.remove());
  const seen = new Map();
  GAMES.forEach(g=>{
    if(!FIXED_CATS.includes(g.cat) && g.catLabel && !seen.has(g.cat)) seen.set(g.cat, g.catLabel);
  });
  seen.forEach((label, cat)=>{
    const btn = document.createElement('button');
    btn.className = 'chip chip-dynamic';
    btn.dataset.cat = cat;
    btn.textContent = label;
    chipsEl.appendChild(btn);
  });
  chipsEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  const stillExists = chipsEl.querySelector(`.chip[data-cat="${activeCatBefore}"]`);
  (stillExists || chipsEl.querySelector('.chip[data-cat="todos"]')).classList.add('active');
}
function renderHiddenLink(){
  let bar = document.getElementById('hiddenGamesBar');
  hiddenGameIds = loadHiddenGames();
  if(hiddenGameIds.length===0){
    if(bar) bar.remove();
    return;
  }
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'hiddenGamesBar';
    bar.className = 'hidden-games-bar';
    grid.insertAdjacentElement('afterend', bar);
  }
  const n = hiddenGameIds.length;
  bar.textContent = n===1 ? t('hidden_bar_one') : t('hidden_bar_many',{n});
  bar.onclick = ()=>{
    showConfirm(t('restore_confirm_msg'), t('restore_confirm_btn'), async ()=>{
      saveHiddenGames([]);
      hiddenGameIds = [];
      await syncToServer();
      location.reload();
    });
  };
}

/* filter by category */
document.getElementById('chips').addEventListener('click', e=>{
  const btn = e.target.closest('.chip');
  if(!btn) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat;
  applyFilters(cat, document.getElementById('search').value);
});
document.getElementById('search').addEventListener('input', e=>{
  const activeCat = document.querySelector('.chip.active').dataset.cat;
  applyFilters(activeCat, e.target.value);
});
function applyFilters(cat, query){
  query = query.trim().toLowerCase();
  const filtered = GAMES.filter(g=>{
    const catOk = cat==='todos' || g.cat===cat;
    const qOk = g.name.toLowerCase().includes(query);
    return catOk && qOk;
  });
  renderGrid(filtered);
}

/* janela de confirmação própria — não depende do confirm() nativo do navegador,
   que não funciona em alguns visualizadores de app */
function showConfirm(message, confirmLabel, onConfirm){
  const bg = document.createElement('div');
  bg.className = 'confirm-bg';
  bg.innerHTML = `
    <div class="confirm-card">
      <p class="confirm-msg">${message}</p>
      <div class="confirm-actions">
        <button class="confirm-cancel">Cancelar</button>
        <button class="confirm-ok">${confirmLabel || 'Confirmar'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(bg);
  function close(){ if(bg.parentNode) bg.parentNode.removeChild(bg); }
  bg.querySelector('.confirm-cancel').addEventListener('click', close);
  bg.addEventListener('click', e=>{ if(e.target===bg) close(); });
  bg.querySelector('.confirm-ok').addEventListener('click', ()=>{ close(); onConfirm(); });
}

/* tiny toast */
let toastTimer;
function toast(msg){
  let t = document.getElementById('toastEl');
  if(!t){
    t = document.createElement('div');
    t.id = 'toastEl';
    t.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#08322B;color:#eafff8;padding:10px 20px;border-radius:999px;font-family:Baloo 2,sans-serif;font-weight:600;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.3);pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.opacity='0'; }, 1800);
}

const overlay = document.getElementById('overlay');
const modalBody = document.getElementById('modalBody');
const modalTitle = document.getElementById('modalTitle');
let activeCleanup = null;

function openGame(id, name){
  modalTitle.textContent = name;
  modalBody.innerHTML = '';
  overlay.classList.remove('hidden');
  const customGame = GAMES.find(g=>g.id===id && g.custom);
  document.getElementById('modalCard').classList.toggle('warm-theme', id==='2048');
  document.getElementById('modalCard').classList.toggle('app-embed', id==='carreira' || !!customGame);
  document.getElementById('modalCard').classList.toggle('iframe-fill', id==='carreira' || !!customGame);
  document.getElementById('modalCard').classList.remove('arcade-theme', 'chat-fill');
  if(customGame){
    const needsSetup = customGame.hasDifficulty || (customGame.multiplayerCounts && customGame.multiplayerCounts.length>0);
    if(needsSetup){
      document.getElementById('modalCard').classList.remove('iframe-fill');
      renderCustomGameSetup(modalBody, customGame, (opts)=>{
        document.getElementById('modalCard').classList.add('iframe-fill');
        activeCleanup = initCustomGame(modalBody, customGame, opts);
      });
      activeCleanup = ()=>{};
    } else {
      activeCleanup = initCustomGame(modalBody, customGame);
    }
    return;
  }
  const inits = {snake:initSnake, '2048':init2048, memoria:initMemory, ttt:initTTT, wam:initWAM, corrida:initRace, quebra:initBreakout, labirinto:initMaze, carreira:initCareerSim, xadrez:initChess};
  activeCleanup = inits[id](modalBody);
}
function renderCustomGameSetup(root, game, launch){
  let playerCount = (game.multiplayerCounts && game.multiplayerCounts[0]) || null;
  function draw(){
    root.innerHTML = `
      <div class="setup">
        ${game.multiplayerCounts && game.multiplayerCounts.length ? `
          <h3>${t('setup_players_count_q')}</h3>
          <div class="seg" id="setupPlayerCount">
            ${game.multiplayerCounts.map(n=>`<button class="seg-btn ${n===playerCount?'on':''}" data-n="${n}">${n}</button>`).join('')}
          </div>` : ''}
        ${game.hasDifficulty ? `
          <h3>${t('setup_diff_q')}</h3>
          <div class="diff-grid" id="setupDiffs">
            ${DIFFS.map(d=>`<button class="diff-btn" data-diff="${d.id}" style="background:${d.color}">${d.label}<small>${d.note}</small></button>`).join('')}
          </div>
        ` : `<button class="go-btn" id="setupGo">${t('setup_start')}</button>`}
      </div>`;
    const pcEl = root.querySelector('#setupPlayerCount');
    if(pcEl) pcEl.addEventListener('click', e=>{
      const b = e.target.closest('.seg-btn'); if(!b) return;
      playerCount = Number(b.dataset.n); draw();
    });
    const go = root.querySelector('#setupGo');
    if(go) go.addEventListener('click', ()=>launch({diff:null, playerCount}));
    const diffsEl = root.querySelector('#setupDiffs');
    if(diffsEl) diffsEl.addEventListener('click', e=>{
      const b = e.target.closest('.diff-btn'); if(!b) return;
      launch({diff:b.dataset.diff, playerCount});
    });
  }
  draw();
}
function initCustomGame(root, game, opts){
  root.innerHTML = '';
  const codeText = b64ToUtf8(game.codeB64);
  const iframe = document.createElement('iframe');
  iframe.className = 'app-frame';
  iframe.setAttribute('title', game.name);
  if(opts){
    const inject = '<script>window.JOGODROMO_DIFFICULTY='+JSON.stringify(opts.diff||null)+';window.JOGODROMO_PLAYER_COUNT='+JSON.stringify(opts.playerCount||1)+';<\/script>';
    iframe.srcdoc = inject + codeText;
  } else {
    iframe.srcdoc = codeText;
  }
  root.appendChild(iframe);
  return ()=>{ root.innerHTML=''; };
}
function closeModal(){
  overlay.classList.add('hidden');
  if(activeCleanup) activeCleanup();
  activeCleanup = null;
  modalBody.innerHTML = '';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

function relativeTimeAgo(ts){
  if(!ts) return '';
  const diff = Date.now() - ts;
  const min = Math.floor(diff/60000);
  if(min < 1) return t('time_now');
  if(min < 60) return t('time_min_ago', {n:min});
  const hr = Math.floor(min/60);
  if(hr < 24) return t('time_hr_ago', {n:hr});
  const day = Math.floor(hr/24);
  return t('time_day_ago', {n:day});
}

        longPressed = true;

function utf8ToB64(str){
  try{ return btoa(unescape(encodeURIComponent(str))); }
  catch(e){
    // resposta de IA truncada no meio de um emoji pode deixar um "surrogate"
    // sozinho, o que quebra encodeURIComponent — removemos e tentamos de novo.
    const cleaned = str.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?:[^\uD800-\uDBFF]|^)[\uDC00-\uDFFF]/g, '');
    return btoa(unescape(encodeURIComponent(cleaned)));
  }
}
function b64ToUtf8(b64){
  try{ return decodeURIComponent(escape(atob(b64))); }
  catch(e){ return atob(b64); }
}
function makeGameBlobUrl(code){
  const blob = new Blob([code], {type:'text/html;charset=utf-8'});
  return URL.createObjectURL(blob);
}

function publishGame(name, code, coverDataUri, editingId, category, hasDifficulty, multiplayerCounts){
  if(!name){ toast(t('code_form_name_needed')); return false; }
  if(!code || !code.trim() || code.trim().length<20 || !code.includes('<')){ toast(t('code_form_code_incomplete')); return false; }
  multiplayerCounts = multiplayerCounts || [];
  if(editingId){
    const list = loadCustomGames();
    const idx = list.findIndex(r=>r.id===editingId);
    if(idx>=0){
      const newCat = category!==undefined ? category : list[idx].category;
      list[idx] = {
        ...list[idx], name, category:newCat, cover: coverDataUri || list[idx].cover || null, codeB64: utf8ToB64(code),
        hasDifficulty: hasDifficulty!==undefined ? hasDifficulty : !!list[idx].hasDifficulty,
        multiplayerCounts: multiplayerCounts.length ? multiplayerCounts : (list[idx].multiplayerCounts || [])
      };
      const ok = saveCustomGames(list);
      if(!ok){ toast(t('code_form_too_big')); return false; }
      GAMES = GAMES.map(g=> g.id===editingId ? toRenderableCustomGame(list[idx]) : g);
      renderDynamicCategoryChips();
      closeModal();
      const activeCat = document.querySelector('.chip.active').dataset.cat;
      applyFilters(activeCat, document.getElementById('search').value);
      toast(t('pub_updated'));
      syncToServer();
      return true;
    }
  }
  const palette = ['#FF6B5B','#3DA9FC','#FFC93C','#9B6DFF','#26D0A0','#FF9F45','#FF74B1'];
  const bg = 'linear-gradient(135deg,'+palette[Math.floor(Math.random()*palette.length)]+','+palette[Math.floor(Math.random()*palette.length)]+')';
  const rec = {
    id: 'custom_'+Date.now()+'_'+Math.floor(Math.random()*9999),
    name, category: category || null, bg, cover: coverDataUri || null,
    codeB64: utf8ToB64(code),
    hasDifficulty: !!hasDifficulty,
    multiplayerCounts: multiplayerCounts,
    createdAt: Date.now()
  };
  const list = loadCustomGames();
  list.push(rec);
  const ok = saveCustomGames(list);
  if(!ok){ toast(t('code_form_too_big')); return false; }
  GAMES.push(toRenderableCustomGame(rec));
  renderDynamicCategoryChips();
  closeModal();
  const targetCat = toRenderableCustomGame(rec).cat;
  const chipToClick = document.querySelector(`.chip[data-cat="${targetCat}"]`) || document.querySelector('.chip[data-cat="todos"]');
  chipToClick.click();
  toast(t('pub_success'));
  syncToServer();
  return true;
}

function renderGameChat(root, seed){
  root.innerHTML = `

  const previewFrame = root.querySelector('#previewFrame');
  const publishCard = root.querySelector('#publishCard');
  const attachInputEl = root.querySelector('#attachInput');

  let apiHistory = [];
  let pendingGameCode = seed ? seed.code : null;
  let pendingCover = null;
  let currentDraftId = null;
  let messageLog = [];
  let editingGameId = seed && seed.editingId ? seed.editingId : null;
  let resumeDraft = null;
  if(seed && seed.resumeDraftId){
    resumeDraft = loadDrafts().find(d=>d.id===seed.resumeDraftId) || null;
  }
  if(resumeDraft){
    currentDraftId = resumeDraft.id;
    pendingGameCode = resumeDraft.code;
    pendingCover = resumeDraft.cover || null;
  }
  if(pendingGameCode){
    apiHistory = [
      {role:'user', content:'(current game code, for you to use as a starting point)'},
      {role:'assistant', content:'```html\n'+pendingGameCode+'\n```'}
    ];
  }

  function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }
  function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function autoChatName(){
    const firstUserMsg = messageLog.find(m=>m.role==='user');
    if(!firstUserMsg) return t('chat_untitled');
    let txt = firstUserMsg.html.replace(/<[^>]+>/g,'').trim();
    if(!txt) txt = t('chat_untitled');
    return txt.length > 40 ? txt.slice(0,40)+'…' : txt;
  }
  function persistChat(name){
    const list = loadDrafts();
    const existing = currentDraftId ? list.find(d=>d.id===currentDraftId) : null;
    const finalName = name || (existing ? existing.name : null) || autoChatName();
    if(currentDraftId){
      const idx = list.findIndex(d=>d.id===currentDraftId);
      if(idx>=0) list[idx] = {...list[idx], name:finalName, code:pendingGameCode, cover:pendingCover, messages:messageLog.slice(), updatedAt:Date.now()};
      else list.push({id:currentDraftId, name:finalName, code:pendingGameCode, cover:pendingCover, messages:messageLog.slice(), createdAt:Date.now(), updatedAt:Date.now()});
    } else {
      currentDraftId = 'draft_'+Date.now()+'_'+Math.floor(Math.random()*9999);
      list.push({id:currentDraftId, name:finalName, code:pendingGameCode, cover:pendingCover, messages:messageLog.slice(), createdAt:Date.now(), updatedAt:Date.now()});
    }
    const ok = saveDrafts(list);
    if(ok) syncToServer();
    return ok;
  }
  function autoSaveChat(){
    if(messageLog.length === 0) return;
    persistChat(null);
  }

  function addBubble(role, html){
    const wrap = document.createElement('div');
    wrap.className = 'chat-msg '+role;
    wrap.innerHTML = `<div class="chat-bubble">${html}</div>`;
    messagesEl.appendChild(wrap);
    scrollToBottom();
    messageLog.push({role, html});
    autoSaveChat();
    return wrap.querySelector('.chat-bubble');
  }
  function addTyping(){
    const wrap = document.createElement('div');
    wrap.className = 'chat-msg agent';
    wrap.id = 'typingBubble';
    wrap.innerHTML = `<div class="chat-bubble"><div class="chat-typing"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(wrap);
    scrollToBottom();
  }
  function removeTyping(){ const t = root.querySelector('#typingBubble'); if(t) t.remove(); }

  function openPreview(){
    if(!pendingGameCode) return;
    previewFrame.srcdoc = pendingGameCode;
    previewEl.style.display = 'flex';
  }
  root.querySelector('#backToChat').addEventListener('click', ()=>{ previewEl.style.display='none'; });

  if(resumeDraft){
    if(resumeDraft.messages && resumeDraft.messages.length){
      resumeDraft.messages.forEach(m=>addBubble(m.role, m.html));
    }
    if(pendingGameCode){
      const bb = addBubble('agent', escapeHtml(t('draft_continued_actions')));
      showGameReadyActions(bb);
    }
  } else if(seed && seed.code){
    const b = addBubble('agent', escapeHtml(t('agent_adjust_welcome', {name:seed.name})));
