  async function callAgent(userText){
    apiHistory.push({role:'user', content:userText});
    const langNote = {pt:'Responda em português.', en:'Reply in English.', es:'Responde en español.'}[currentLang] || '';
    const system = `Você é o assistente completo do Jogódromo, um portal de joguinhos web — e, quando o assunto é criar jogos, você veste o chapéu de um game designer e programador MUITO experiente, do nível de quem já lançou jogos de verdade, não protótipos de fim de semana. Games are your craft, not a chore to finish quickly.

Você faz duas coisas:
1. Cria e edita jogos.
2. Conversa e tira dúvidas sobre qualquer coisa — inclusive sobre o próprio site (depois de gerar um jogo dá pra tocar em "Testar jogo" pra ver rodando, "Dar nome e publicar" pra colocar no catálogo com nome/capa/categoria, "Apagar" pra descartar, "Copiar código" pra levar o código pra outro lugar; a conversa fica salva sozinha, sem precisar clicar em nada; dá pra colar um código pronto de qualquer IA a qualquer momento; e depois de testar, a pessoa pode só descrever o que quer mudar, quantas vezes quiser, na mesma conversa).

Only produce a code block when the person is actually asking you to create or change a game — never for a question or regular conversation.

## Antes de escrever qualquer código: entenda o que a pessoa quer

Se o pedido for vago, curto ou genérico ("faça um jogo de guerra", "cria um jogo de corrida", "quero um jogo de plataforma", ou até "faça um jogo bem simples de X" — "simples" não é um pedido de mecânica, é só um pedido de escopo) — NÃO escreva código ainda. Em vez disso, faça de 2 a 4 perguntas curtas e diretas (nesse idioma: ${langNote}) pra entender o que a pessoa realmente imagina: o tipo de mecânica central (atirar, desviar, resolver, correr, construir...), a visão/câmera (de cima, de lado, primeira pessoa), como se joga no toque, e o que define vitória/derrota ou progresso. Só escreva o código depois de ter esse quadro claro — ou imediatamente, sem perguntar, se a pessoa disser algo como "surpreenda-me", "decida você", ou já tiver dado detalhes suficientes num pedido mais completo.

"Simples" pra pessoa quase sempre quer dizer "fácil de aprender a jogar", não "pobre em conteúdo". Um jogo com uma mecânica central bem simples ainda pode — e deve — ter todo o polimento e profundidade descritos abaixo. Nunca interprete "simples" como desculpa pra entregar algo raso.

## Quando FOR o momento de criar ou mudar um jogo: o padrão é alto, sempre

Cada jogo que você entrega devia parecer algo que alguém pagaria pra jogar, não um rascunho. Isso significa, sempre que fizer sentido pro tipo de jogo pedido:

**Estrutura e sensação de jogo completo**
- Uma telinha inicial (nome do jogo + como jogar + botão "Jogar"), não cair direto na ação sem contexto.
- Estados claros: menu → jogando → (pausado, se fizer sentido) → fim de jogo — nunca só um loop que começa sozinho e não tem fim nem recomeço.
- Tela de fim de jogo mostrando a pontuação, e um jeito claro de jogar de novo sem precisar recarregar a página.
- Recorde salvo em localStorage (chave própria do jogo) e mostrado tanto durante quanto no fim da partida.
- Progressão real: o jogo fica mais difícil/interessante com o tempo (mais velocidade, mais inimigos, fases, ondas, upgrades) — evite um desafio estático do primeiro ao último segundo.

**Sensação de resposta ("game feel")**
- Feedback visual imediato pra toda ação que importa: flash de cor, partículas simples desenhadas no canvas, leve tremor de tela num impacto forte, um "squash and stretch" sutil num pulo ou colisão. Isso é o que faz um jogo parecer vivo — não pule essa parte achando que é só enfeite.
- Movimento suave e consistente: use requestAnimationFrame com deltaTime (baseado no tempo real entre frames), nunca incrementos fixos por frame — senão a velocidade varia com a taxa de atualização do aparelho.
- Transições suaves (easing) em vez de valores pulando de um estado a outro.

**Som**
- Adicione efeitos sonoros simples gerados por código via Web Audio API (osciladores com um envelope curto de volume) pra ações-chave (pular, acertar, pontuar, perder) — nunca dependa de arquivos de áudio externos, já que o jogo precisa ser um único arquivo autocontido. Um som curto e certo já muda completamente a sensação de qualidade. Inclua também um botão discreto de mudo, guardando a preferência em localStorage.

**Profundidade de conteúdo**
- Mais de um tipo de inimigo/obstáculo/desafio quando o gênero permitir, não só uma coisa repetida sem variação.
- Alguma forma de escolha ou progressão pro jogador — power-ups, upgrades, fases, ou pontuação por combos — algo que dê motivo pra continuar jogando além da primeira tentativa.
- Se o pedido for um gênero clássico (corrida, tiro, plataforma, quebra-cabeça, etc.), pense no que os jogos bons desse gênero têm e não deixe de fora sem um bom motivo.

**Visual**
- Paleta de cores pensada (gradientes, sombras, contraste), nunca as cores cruas padrão do navegador.
- Formas desenhadas via canvas/SVG/CSS — nunca emojis dentro do jogo (quebram em vários aparelhos).
- Tudo desenhado do zero, sem depender de nenhuma imagem, fonte ou biblioteca externa.

**Controles no toque**
- Controles grandes o bastante pro dedo, sem depender de teclado.
- Sem interferência de scroll/zoom da página durante o jogo (trate os eventos de toque corretamente).
- O canvas/área de jogo se ajusta bem ao tamanho da tela do aparelho.

**Robustez**
- Teste mentalmente as regras antes de responder: colisões que realmente funcionam, sem travar em casos extremos (vidas chegando a zero, redimensionar a tela, toques muito rápidos em sequência).

Isso não significa exagerar no tamanho do arquivo à toa — significa que cada uma dessas partes, quando cabe no jogo pedido, é tratada com cuidado de verdade, não deixada de lado por pressa. Pense no jogo como algo que você mesmo jogaria de novo, não só o mínimo que tecnicamente atende ao pedido. Não hesite em escrever bastante código quando o jogo pedir — não corte a profundidade do jogo pra deixar a resposta mais curta.

## Dificuldade e multijogador configurados na hora de publicar

O Jogódromo deixa quem publica um jogo marcar, num formulário, se aquele jogo tem "níveis de dificuldade" e/ou "quantos jogadores no mesmo aparelho" — e aí mostra uma telinha própria do site perguntando isso ANTES de carregar o jogo, sem você precisar programar nenhuma tela de menu pra isso. Quando a pessoa pedir um jogo com diferentes dificuldades ou multijogador local, escreva o seu jogo pra LER essas duas variáveis globais logo no início do script (elas já vão existir no ambiente onde o jogo roda, definidas pelo próprio site antes do seu código executar):
- \`window.JOGODROMO_DIFFICULTY\` — uma destas strings: 'facil', 'medio', 'dificil', 'extremo' (ou null se a pessoa não marcou a opção de dificuldade ao publicar).
- \`window.JOGODROMO_PLAYER_COUNT\` — um número (2, 3 ou 4) com quantas pessoas vão jogar juntas, ou 1 se for só single-player.

Use esses valores pra ajustar o jogo de verdade (velocidade/quantidade de inimigos e generosidade do tempo pra cada dificuldade; controles, câmera dividida ou turnos alternados pra cada contagem de jogadores) — não só cosmético. Se a pessoa não pediu nada sobre dificuldade ou multijogador, não precisa ler essas variáveis nem se preocupar com elas.

Cada jogo é um único arquivo HTML autocontido (HTML, CSS e JavaScript juntos, sem nenhuma dependência externa). Responda com uma frase curta (nesse idioma: ${langNote}) contando o que fez, e depois o código HTML completo dentro de um bloco \`\`\`html ... \`\`\` — sempre o ARQUIVO INTEIRO, nunca só as mudanças. Quando for uma pergunta, uma conversa comum, ou as perguntas de esclarecimento acima: responda só em texto normal (nesse idioma: ${langNote}), sem nenhum bloco de código.`;
    const res = await fetch(SERVER_URL ? (SERVER_URL+'/agent') : 'https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens: 16000,
        system,
        messages: apiHistory
      })
    });
    if(!res.ok) throw new Error('status '+res.status);
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.text||'').join('\n');
    apiHistory.push({role:'assistant', content:text});
    const match = text.match(/```html\s*([\s\S]*?)```/i) || text.match(/```\s*([\s\S]*?)```/);
    const code = match ? match[1].trim() : null;
    const comment = text.replace(/```[\s\S]*?```/,'').trim();
    return {code, comment};
  }

  async function handleSend(){
    const text = inputEl.value.trim();
    if(!text) return;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    hideHero();

    if(looksLikeCode(text)){
      addBubble('user', `${ICONS.code} <b>${t('agent_code_received')}</b> (${t('agent_code_chars',{n:text.length.toLocaleString()})})`);
      pendingGameCode = text;
      const b = addBubble('agent', t('agent_code_ok'));
      showGameReadyActions(b);
      return;
    }

    addBubble('user', escapeHtml(text));
    addTyping();
    try{
      const {code, comment} = await callAgent(text);
      removeTyping();
      if(code){
        pendingGameCode = code;
        const b = addBubble('agent', escapeHtml(comment || t('agent_code_ok')));
        showGameReadyActions(b);
      } else {
        addBubble('agent', escapeHtml(comment || t('agent_code_ok')));
      }
    }catch(err){
      removeTyping();
      const failB = addBubble('agent', `${t('agent_fail')}<div class="chat-actions"><button class="btn-publish" data-act="gofail">${ICONS.rocket} ${t('agent_fail_btn')}</button></div>`);
      failB.querySelector('[data-act="gofail"]').addEventListener('click', ()=>{
        document.getElementById('modalCard').classList.remove('chat-fill');
        renderDirectPublish(root, ()=>{
          document.getElementById('modalCard').classList.add('chat-fill');
          renderGameChat(root);
        });
      });
    }
  }

  root.querySelector('#sendBtn').addEventListener('click', handleSend);
  inputEl.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }
  });
  inputEl.addEventListener('input', ()=>{
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(100, inputEl.scrollHeight)+'px';
  });

  root.querySelector('#attachBtn').addEventListener('click', ()=>attachInputEl.click());
  attachInputEl.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW=400, maxH=300;
        let w=img.width, h=img.height;
        const scale=Math.min(1, maxW/w, maxH/h);
        w=Math.round(w*scale); h=Math.round(h*scale);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        pendingCover = c.toDataURL('image/jpeg',0.82);
        hideHero();
        addBubble('user', `<img src="${pendingCover}"><div style="margin-top:4px;">${t('agent_photo_sent')}</div>`);
        if(pendingGameCode){
          addBubble('agent', t('agent_photo_ok_pending'));
        } else {
          addBubble('agent', t('agent_photo_ok_nogame'));
        }
        if(publishCard.style.display==='block'){
          const pv = publishCard.querySelector('#pubCoverPreview');
          if(pv) pv.innerHTML = `<img src="${pendingCover}">`;
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  const micBtn = root.querySelector('#micBtn');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRec){
    micBtn.style.display = 'none';
  } else {
    let recognizer = null, listening = false;
    micBtn.addEventListener('click', ()=>{
      if(listening){ if(recognizer) recognizer.stop(); return; }
      try{
        recognizer = new SpeechRec();
        recognizer.lang = {pt:'pt-BR', en:'en-US', es:'es-ES'}[currentLang] || 'pt-BR';
        recognizer.interimResults = false;
        recognizer.maxAlternatives = 1;
        recognizer.onstart = ()=>{ listening = true; micBtn.classList.add('listening'); };
        recognizer.onend = ()=>{ listening = false; micBtn.classList.remove('listening'); };
        recognizer.onerror = ()=>{
          listening = false; micBtn.classList.remove('listening');
          toast(t('mic_error'));
        };
        recognizer.onresult = e=>{
          const said = e.results[0][0].transcript;
          inputEl.value = (inputEl.value ? inputEl.value+' ' : '') + said;
          inputEl.dispatchEvent(new Event('input'));
        };
        recognizer.start();
      }catch(err){
        toast(t('mic_unavailable'));
      }
    });
  }
}

function renderSetup(root, cfg, launch){
  let mode = (cfg.modes && cfg.modes[0].id) || 'solo';
  let pieceColor = 'w';
  function draw(){
    const duo = mode==='duo';
    root.innerHTML = `
      <div class="setup">
        ${cfg.modes ? `
          <h3>${t('setup_players_q')}</h3>
          <div class="seg" id="setupModes">
            ${cfg.modes.map(m=>`<button class="seg-btn ${m.id===mode?'on':''}" data-mode="${m.id}">${m.label}</button>`).join('')}
          </div>` : ''}
        ${duo ? `
          <p class="sub">${cfg.duoHint || t('setup_duo_default')}</p>
          <button class="go-btn" id="setupGo">${t('setup_start')}</button>
        ` : `
          <h3>${t('setup_diff_q')}</h3>
          ${cfg.hint ? `<p class="sub">${cfg.hint}</p>` : ''}
          <div class="diff-grid" id="setupDiffs">
            ${DIFFS.map(d=>`<button class="diff-btn" data-diff="${d.id}" style="background:${d.color}">${d.label}<small>${d.note}</small></button>`).join('')}
          </div>
          ${cfg.pieceChoice ? `
            <h3>${t('chess_pieces_q')}</h3>
            <div class="seg" id="setupPieces">
              <button class="seg-btn ${pieceColor==='w'?'on':''}" data-color="w">${t('chess_white')}</button>
              <button class="seg-btn ${pieceColor==='b'?'on':''}" data-color="b">${t('chess_black')}</button>
            </div>
          ` : ''}
        `}
      </div>`;
    const modesEl = root.querySelector('#setupModes');
    if(modesEl) modesEl.addEventListener('click', e=>{
      const b = e.target.closest('.seg-btn'); if(!b) return;
      mode = b.dataset.mode; draw();
    });
    const piecesEl = root.querySelector('#setupPieces');
    if(piecesEl) piecesEl.addEventListener('click', e=>{
      const b = e.target.closest('.seg-btn'); if(!b) return;
      pieceColor = b.dataset.color; draw();
    });
    const go = root.querySelector('#setupGo');
    if(go) go.addEventListener('click', ()=>launch({diff:'medio', mode, color:pieceColor}));
    const diffsEl = root.querySelector('#setupDiffs');
    if(diffsEl) diffsEl.addEventListener('click', e=>{
      const b = e.target.closest('.diff-btn'); if(!b) return;
      launch({diff:b.dataset.diff, mode, color:pieceColor});
    });
  }
  draw();
}

/* Wraps a game so it starts on a setup screen and can return to it. */
function withSetup(cfg, runner){
  return function(root){
    let inner = null;
    function back(){
      if(inner){ inner(); inner = null; }
      renderSetup(root, cfg, launch);
    }
    function launch(opts){
      if(inner){ inner(); inner = null; }
      opts.back = back;
      inner = runner(root, opts) || (()=>{});
    }
    renderSetup(root, cfg, launch);
    return ()=>{ if(inner) inner(); };
  };
}

function padHTML(kind){

    return `<div class="pad pad-lr">
      <button class="pad-btn" data-dir="left" aria-label="Esquerda">◀</button>
      <button class="pad-btn" data-dir="right" aria-label="Direita">▶</button>
    </div>`;
  }
  return `<div class="pad">
    <button class="pad-btn pad-up" data-dir="up" aria-label="Cima">▲</button>
    <button class="pad-btn pad-left" data-dir="left" aria-label="Esquerda">◀</button>
    <button class="pad-btn pad-down" data-dir="down" aria-label="Baixo">▼</button>
    <button class="pad-btn pad-right" data-dir="right" aria-label="Direita">▶</button>
  </div>`;
}
/* Wires a pad to a handler. opts.repeat = ms to auto-repeat while held (0 = no repeat). */
function wirePad(root, handler, opts){
  opts = opts || {};
  const pad = root.querySelector('.pad');
  if(!pad) return ()=>{};
  let holdTimer=null, repeatTimer=null;
  function stopHold(){ clearTimeout(holdTimer); clearInterval(repeatTimer); holdTimer=null; repeatTimer=null; }
  function press(dir){
    handler(dir);
    if(opts.repeat){
      stopHold();
      holdTimer = setTimeout(()=>{ repeatTimer = setInterval(()=>handler(dir), opts.repeat); }, 260);
    }
  }
  function onDown(e){
    const btn = e.target.closest('.pad-btn');
    if(!btn) return;
    e.preventDefault();
    press(btn.dataset.dir);
  }
  pad.addEventListener('pointerdown', onDown);
  pad.addEventListener('pointerup', stopHold);
  pad.addEventListener('pointercancel', stopHold);
  pad.addEventListener('pointerleave', stopHold);
  window.addEventListener('pointerup', stopHold);
  return ()=>{ stopHold(); window.removeEventListener('pointerup', stopHold); };
}

   SHARED: recordes (hoje / semana / mês / total), salvos no aparelho
============================================================ */
function recStorageOk(){
  try{ const k='__jd_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
const REC_OK = recStorageOk();
function recLoad(gameId){
  if(!REC_OK) return [];
  try{ return JSON.parse(localStorage.getItem('jogodromo_rec_'+gameId)) || []; }
  catch(e){ return []; }
}
function recSave(gameId, entries){
  if(!REC_OK) return;
  try{ localStorage.setItem('jogodromo_rec_'+gameId, JSON.stringify(entries)); }catch(e){}
}
/* registra uma pontuação; 'melhor' pode ser 'max' (padrão) ou 'min' (ex.: menor tempo) */
function recSubmit(gameId, value){
  if(value===null || value===undefined) return;
  const entries = recLoad(gameId);
  entries.push({v:value, t:Date.now()});
  if(entries.length>800) entries.splice(0, entries.length-800);
  recSave(gameId, entries);
}
function recStartOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function recStartOfWeek(ts){ const d=new Date(ts); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); d.setHours(0,0,0,0); return d.getTime(); }
function recStartOfMonth(ts){ const d=new Date(ts); d.setDate(1); d.setHours(0,0,0,0); return d.getTime(); }
function recSummary(gameId, mode){
  const entries = recLoad(gameId);
  const now = Date.now();
  const bounds = {day:recStartOfDay(now), week:recStartOfWeek(now), month:recStartOfMonth(now), all:0};
  const pick = mode==='min' ? Math.min : Math.max;
  const empty = mode==='min' ? Infinity : 0;
  const out = {};
  for(const key in bounds){
    const vals = entries.filter(e=>e.t>=bounds[key]).map(e=>e.v);
    out[key] = vals.length ? vals.reduce((a,b)=>pick(a,b), vals[0]) : (mode==='min' ? null : 0);
  }
  return out;
}
function recBarHTML(){
  return `<div class="rec-bar">
    <span class="rec-chip"><b>${t('rec_today')}</b><i>–</i></span>
    <span class="rec-chip"><b>${t('rec_week')}</b><i>–</i></span>
    <span class="rec-chip"><b>${t('rec_month')}</b><i>–</i></span>
    <span class="rec-chip"><b>${t('rec_total')}</b><i>–</i></span>
  </div>`;
}
function recBarUpdate(root, gameId, mode, fmt){
  if(!REC_OK) return;
  const bar = root.querySelector('.rec-bar');
  if(!bar) return;
  const sum = recSummary(gameId, mode);
  const cells = bar.querySelectorAll('.rec-chip i');
  const order = ['day','week','month','all'];
  order.forEach((k,i)=>{
    const v = sum[k];
    cells[i].textContent = (v===null || v===undefined) ? '–' : (fmt ? fmt(v) : v);
  });
}

============================================================ */
const initTTT = withSetup({
  modes:[{id:'solo',label:t('setup_1p')},{id:'duo',label:t('setup_2p')}],
  hint:t('ttt_hint'),
  duoHint:t('ttt_duo_hint')
}, function(root, opts){
  const duo = opts.mode==='duo';
  root.innerHTML = `
    ${diffTagHTML(opts)}
    <div class="g-row">
      <span class="g-stat">${duo?t('ttt_p1_x'):t('ttt_you_x')}</span>
      <span class="g-stat">${duo?t('ttt_p2_o'):t('ttt_computer_o')}</span>
    </div>
    <div class="g-msg" id="tttMsg"></div>
    <div class="ttt-board" id="tttBoard"></div>
    <div class="g-row" style="justify-content:center;margin-top:14px;"><button class="g-btn" id="tttReset">${t('btn_reset')}</button></div>
  `;
  wireDiffTag(root, opts);
  const boardEl = root.querySelector('#tttBoard');
  const msgEl = root.querySelector('#tttMsg');
  let board, over, turn;
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  function checkWin(b,p){ return wins.some(w=>w.every(i=>b[i]===p)); }
  function freeCells(b){ return b.map((v,i)=>v===null?i:null).filter(v=>v!==null); }

  /* --- unbeatable minimax --- */
  function minimax(b, player){
    if(checkWin(b,'O')) return {score:1};
    if(checkWin(b,'X')) return {score:-1};
    const free = freeCells(b);
    if(!free.length) return {score:0};
    let best = null;
    for(const i of free){
      b[i] = player;
      const r = minimax(b, player==='O'?'X':'O');
      b[i] = null;
      if(!best ||
         (player==='O' && r.score > best.score) ||
         (player==='X' && r.score < best.score)){
        best = {score:r.score, idx:i};
      }
    }
    return best;
  }
  function heuristicMove(){
    for(const w of wins){
      const vals = w.map(i=>board[i]);
      if(vals.filter(v=>v==='O').length===2 && vals.includes(null)) return w[vals.indexOf(null)];
    }
    for(const w of wins){
      const vals = w.map(i=>board[i]);
      if(vals.filter(v=>v==='X').length===2 && vals.includes(null)) return w[vals.indexOf(null)];
    }
    if(board[4]===null) return 4;
    const corners = [0,2,6,8].filter(i=>board[i]===null);
    if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
    const free = freeCells(board);
    return free[Math.floor(Math.random()*free.length)];
  }
  function aiMove(){
    const free = freeCells(board);
    let idx;
    if(opts.diff==='facil'){
      idx = free[Math.floor(Math.random()*free.length)];
    } else if(opts.diff==='medio'){
      idx = Math.random()<0.5 ? free[Math.floor(Math.random()*free.length)] : heuristicMove();
    } else if(opts.diff==='dificil'){
      idx = Math.random()<0.2 ? heuristicMove() : minimax(board.slice(),'O').idx;
    } else {
      idx = minimax(board.slice(),'O').idx;
    }
    if(idx===undefined) idx = free[0];
    board[idx] = 'O';
    return idx;
  }

  function say(){
    if(over) return;
    msgEl.textContent = duo
      ? t('ttt_turn_p', {n: turn==='X'?1:2, m:turn})
      : t('ttt_your_turn');
  }
  function render(newIndices){
    newIndices = newIndices || [];
    boardEl.innerHTML = '';
    board.forEach((v,i)=>{
      const c = document.createElement('div');
      c.className = 'ttt-cell ' + (v==='X'?'x':v==='O'?'o':'') + (newIndices.includes(i)?' pop':'');
      c.textContent = v || '';
      c.addEventListener('click', ()=>handleClick(i));
      boardEl.appendChild(c);
    });
  }
  function finish(text){ over = true; msgEl.textContent = text; }

  function handleClick(i){
    if(over || board[i]) return;
    if(duo){
      board[i] = turn;
      render([i]);
      if(checkWin(board,turn)){ finish(t('ttt_p_wins', {n: turn==='X'?1:2})); return; }
      if(board.every(v=>v)){ finish(t('game_draw')); return; }
      turn = turn==='X' ? 'O' : 'X';
      say();
      return;
    }
    board[i] = 'X';
    if(checkWin(board,'X')){ render([i]); finish(t('ttt_you_win')); return; }
    if(board.every(v=>v)){ render([i]); finish(t('game_draw')); return; }
    const aiIdx = aiMove();
    render([i, aiIdx]);
    if(checkWin(board,'O')){ finish(t('ttt_computer_wins')); return; }
    if(board.every(v=>v)){ finish(t('game_draw')); return; }
  }

  function reset(){ board = Array(9).fill(null); over=false; turn='X'; say(); render(); }
  root.querySelector('#tttReset').addEventListener('click', reset);
  reset();
  return ()=>{};
});

const initMemory = withSetup({
  modes:[{id:'solo',label:t('setup_1p')},{id:'duo',label:t('setup_2p')}],
  hint:t('mem_hint'),
  duoHint:t('mem_duo_hint')
}, function(root, opts){
  const duo = opts.mode==='duo';
  const nPairs = MEM_PAIRS[opts.diff] || 8;
  const symbols = Object.keys(MEM_ICONS).slice(0, nPairs);
  const cols = nPairs<=6 ? 4 : (nPairs<=8 ? 4 : (nPairs<=10 ? 5 : 6));

  root.innerHTML = `
    ${diffTagHTML(opts)}
    <div class="g-row">
      <span class="g-stat" id="memMoves">${duo?t('mem_p1_score',{n:0}):t('mem_moves',{n:0})}</span>
      <span class="g-stat" id="memPairs">${duo?t('mem_p2_score',{n:0}):t('mem_pairs',{a:0,b:nPairs})}</span>
    </div>
    ${duo?`<div class="turn-banner turn-p1" id="memTurn">${t('mem_turn_p',{n:1})}</div>`:''}
    <div class="mem-board" id="memBoard" style="grid-template-columns:repeat(${cols},1fr);max-width:${cols*74}px;"></div>

  `;
  wireDiffTag(root, opts);
  const boardEl = root.querySelector('#memBoard');
  const turnEl  = root.querySelector('#memTurn');
  let deck, flipped, matched, moves, lock, turn, scores;

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function updateStats(){
    if(duo){
      root.querySelector('#memMoves').textContent = t('mem_p1_score',{n:scores[0]});
      root.querySelector('#memPairs').textContent = t('mem_p2_score',{n:scores[1]});
      if(turnEl){
        turnEl.className = 'turn-banner ' + (turn===0?'turn-p1':'turn-p2');
        turnEl.textContent = t('mem_turn_p',{n:turn+1});
      }
    } else {
      root.querySelector('#memMoves').textContent = t('mem_moves',{n:moves});
      root.querySelector('#memPairs').textContent = t('mem_pairs',{a:matched.length/2,b:nPairs});
    }
  }
  function render(){
    boardEl.innerHTML='';
    deck.forEach((sym,i)=>{
      const c = document.createElement('div');
      const isFlipped = flipped.includes(i) || matched.includes(i);
      c.className = 'mem-card' + (isFlipped?' flip':'') + (matched.includes(i)?' matched':'');
      c.innerHTML = isFlipped ? `<span class="mem-icon">${MEM_ICONS[sym]}</span>` : '';
      c.addEventListener('click', ()=>flip(i));
      boardEl.appendChild(c);
    });
  }
  function finishCheck(){
    if(matched.length!==deck.length) return;
    if(duo){
      const msg = scores[0]===scores[1] ? t('mem_tie')
        : t('ttt_p_wins', {n: scores[0]>scores[1]?1:2});
      root.querySelector('#memMsg').textContent = msg;
    } else {
      root.querySelector('#memMsg').textContent = t('mem_solo_win', {n:moves});

  function flip(i){
    if(lock || flipped.includes(i) || matched.includes(i)) return;
    flipped.push(i);
    render();
    if(flipped.length===2){
      moves++;
      lock = true;
      const [a,b] = flipped;
      if(deck[a]===deck[b]){
        matched.push(a,b);
        flipped=[];
        lock=false;
        if(duo) scores[turn]++;
        updateStats(); render(); finishCheck();
      } else {
        setTimeout(()=>{
          flipped=[]; lock=false;
          if(duo){ turn = turn===0?1:0; }
          updateStats(); render();
        }, 750);
      }
    }
  }
  function reset(){
    deck = shuffle([...symbols,...symbols]);
    flipped=[]; matched=[]; moves=0; lock=false; turn=0; scores=[0,0];
    root.querySelector('#memMsg').textContent='';
    updateStats(); render();
  }
  root.querySelector('#memReset').addEventListener('click', reset);
  reset();
  return ()=>{};
});

const initSnake = withSetup({hint:'Muda a velocidade — e a cor do cenário.'}, function(root, opts){
  const tickMs = SNAKE_SPEED[opts.diff] || 135;
  const T = SNAKE_THEME[opts.diff] || SNAKE_THEME.medio;
  root.innerHTML = `
    ${diffTagHTML(opts)}
    <div class="snake-hud" style="background:${T.hud}">
      <span class="snake-hud-item"><span class="snake-hud-ico" style="color:${T.food}">${appleIconSVG()}</span><b id="snakeScore">0</b></span>
      <span class="snake-hud-item"><span class="snake-hud-ico">🏆</span><b id="snakeBest">0</b></span>
    </div>
    ${recBarHTML()}
    <div class="snake-wrap"><canvas id="snakeCanvas" width="280" height="280" style="border-color:${T.frame};background:${T.bg1}"></canvas></div>
    <div class="g-msg" id="snakeMsg">Use os botões para começar</div>

  `;
  const canvas = root.querySelector('#snakeCanvas');
  const ctx = canvas.getContext('2d');
  const cell = 20, cols = 14, rows = 14;
  let snake, dir, nextDir, food, score, over, timer, running;

  const SN = {body:'#4ED96B', bodyEdge:'#36B551', head:'#5FE87C', pupil:'#1F4A2A', blush:'rgba(255,140,160,.55)'};
  const cx = i => i*cell + cell/2;

  function place(){
    snake = [{x:6,y:7},{x:5,y:7},{x:4,y:7}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    food = randFood();
    score = 0; over = false; running=false;
    root.querySelector('#snakeScore').textContent = '0';
    root.querySelector('#snakeBest').textContent = snakeBest;
    root.querySelector('#snakeMsg').textContent = 'Use os botões para começar';
    recBarUpdate(root, 'snake', 'max');
    draw();
  }
  function randFood(){
    let f;
    do{ f = {x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)}; }
    while(snake.some(s=>s.x===f.x&&s.y===f.y));
    return f;
  }

  function drawField(){
    const g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0, T.bg1); g.addColorStop(1, T.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // pontinhos suaves — bem diferente do xadrez
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        ctx.beginPath();
        ctx.arc(x*cell+cell/2, y*cell+cell/2, cell*0.09, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  function drawFood(px, py, r){
    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.beginPath(); ctx.ellipse(px, py+r*0.95, r*0.8, r*0.26, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#7A5B2E'; ctx.lineWidth = Math.max(1.3, r*0.15); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(px, py-r*0.5); ctx.lineTo(px+r*0.05, py-r*1.15); ctx.stroke();
    ctx.fillStyle = T.leaf;
    ctx.beginPath(); ctx.ellipse(px+r*0.58, py-r*1.06, r*0.48, r*0.24, -0.42, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = T.food;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = T.foodHi;
    ctx.beginPath(); ctx.ellipse(px-r*0.33, py-r*0.35, r*0.30, r*0.19, -0.7, 0, Math.PI*2); ctx.fill();
  }

  function tracePath(){
    ctx.beginPath();
    ctx.moveTo(cx(snake[0].x), cx(snake[0].y));
    for(let i=1;i<snake.length;i++) ctx.lineTo(cx(snake[i].x), cx(snake[i].y));
  }

  function drawSnake(){
    const w = cell*0.76;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // sombra
    ctx.save();
    ctx.translate(0, cell*0.12);
    ctx.strokeStyle = 'rgba(0,0,0,.14)';
    ctx.lineWidth = w; tracePath(); ctx.stroke();
    ctx.restore();
    // contorno + corpo
    ctx.strokeStyle = SN.bodyEdge; ctx.lineWidth = w + 3; tracePath(); ctx.stroke();
    ctx.strokeStyle = SN.body;     ctx.lineWidth = w;     tracePath(); ctx.stroke();

    // cabecinha fofa, virada para onde ela anda
    const hx = cx(snake[0].x), hy = cx(snake[0].y);
    const hr = w/2*1.14;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(Math.atan2(dir.y, dir.x));   // +x = frente

    ctx.fillStyle = 'rgba(0,0,0,.14)';
    ctx.beginPath(); ctx.arc(0, cell*0.12, hr, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = SN.bodyEdge;
    ctx.beginPath(); ctx.arc(0, 0, hr+1.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = SN.head;
    ctx.beginPath(); ctx.arc(0, 0, hr, 0, Math.PI*2); ctx.fill();

    // bochechas
    ctx.fillStyle = SN.blush;
    [-1,1].forEach(sg=>{
      ctx.beginPath();
      ctx.ellipse(-cell*0.02, sg*cell*0.30, cell*0.10, cell*0.07, 0, 0, Math.PI*2);
      ctx.fill();
    });
    // olhos grandes
    const eyeR = cell*0.165, pupR = cell*0.088;
    [-1,1].forEach(sg=>{
      const ex = cell*0.09, ey = sg*cell*0.19;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(ex, ey, eyeR, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = SN.pupil;
      ctx.beginPath(); ctx.arc(ex + eyeR*0.34, ey, pupR, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.arc(ex + eyeR*0.15, ey - eyeR*0.34, pupR*0.42, 0, Math.PI*2); ctx.fill();
    });
    // sorrisinho
    ctx.strokeStyle = SN.pupil;
    ctx.lineWidth = Math.max(1.2, cell*0.055);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cell*0.21, -cell*0.115);
    ctx.quadraticCurveTo(cell*0.31, 0, cell*0.21, cell*0.115);
    ctx.stroke();
    ctx.restore();
  }

  function draw(){
    drawField();
    drawFood(cx(food.x), cx(food.y), cell*0.36);
    drawSnake();
  }

  function step(){
    dir = nextDir;
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=cols||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){
      over = true; running=false; clearInterval(timer);
      root.querySelector('#snakeMsg').textContent = 'Fim de jogo! Pontos: '+score;
      recSubmit('snake', score);
      recBarUpdate(root, 'snake', 'max');
      return;
    }
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){
      score++;
      root.querySelector('#snakeScore').textContent = score;
      if(score>snakeBest){ snakeBest = score; root.querySelector('#snakeBest').textContent = snakeBest; }
      food = randFood();
    } else {
      snake.pop();
    }
    draw();
  }
  function start(){
    if(running||over) return;
    running = true;
    root.querySelector('#snakeMsg').textContent = '';
    timer = setInterval(step, tickMs);
  }
  function setDir(x,y){
    if(dir.x===-x && dir.y===-y) return;
    nextDir = {x,y};
    start();
  }
  function key(e){
    const map = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
    if(map[e.key]){ e.preventDefault(); setDir(...map[e.key]); }
  }
  window.addEventListener('keydown', key);
  canvas.addEventListener('click', start);
  let touchStart=null;
  canvas.addEventListener('touchstart', e=>{ touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
  canvas.addEventListener('touchend', e=>{
    if(!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if(Math.max(Math.abs(dx),Math.abs(dy)) < 18){ start(); return; }
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1, 0);
    else setDir(0, dy>0?1:-1);
  });
  wireDiffTag(root, opts);
  const padDirs = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
  const unwirePad = wirePad(root, d=>setDir(...padDirs[d]));
  root.querySelector('#snakeReset').addEventListener('click', ()=>{ clearInterval(timer); place(); });
  place();
  return ()=>{ clearInterval(timer); window.removeEventListener('keydown', key); unwirePad(); };
});

/* ============================================================
   GAME 4: 2048
============================================================ */
const G2048_TUNE = {
  facil:  {n:5, four:0.05},
  medio:  {n:4, four:0.10},
  dificil:{n:4, four:0.35},
  extremo:{n:3, four:0.45}
};
const init2048 = withSetup({hint:'Muda o tamanho do tabuleiro: quanto menor, mais apertado.'}, function(root, opts){
  const tune = G2048_TUNE[opts.diff] || G2048_TUNE.medio;
  const N = tune.n;
  const GAP = 9;
  const ANIM = 130;          // ms — precisa casar com o transition do CSS
  root.innerHTML = `
    ${diffTagHTML(opts)}
    <div class="g2048-header">
      <div class="g2048-logo">2048</div>
      <div class="g2048-col">
        <div class="g2048-statbox"><span class="label">PONTOS</span><span class="value" id="g2048Score">0</span></div>
        <button class="g2048-pillbtn" id="g2048Reset">REINICIAR</button>
      </div>
      <div class="g2048-col">
        <div class="g2048-statbox"><span class="label">RECORDE</span><span class="value" id="g2048Best">0</span></div>
        <button class="g2048-pillbtn" id="g2048How">COMO JOGAR</button>
      </div>
    </div>
    <p class="g2048-tagline">Junte os números e chegue até o 2048!</p>
    ${recBarHTML()}
    <div class="g2048-board" id="g2048Board">
      <div class="g2048-bg" id="g2048Bg" style="grid-template-columns:repeat(${N},1fr);"></div>
      <div class="g2048-tiles" id="g2048Tiles"></div>
    </div>
    <div class="g-msg" id="g2048Msg"></div>
    ${padHTML()}
    <p class="pad-hint">Use os botões, deslize no tabuleiro ou as setas</p>
  `;
  wireDiffTag(root, opts);
  const boardEl = root.querySelector('#g2048Board');
  const bgEl    = root.querySelector('#g2048Bg');
  const tilesEl = root.querySelector('#g2048Tiles');
  const palette = {2:'#ECDED4',4:'#EBDAC1',8:'#F0A66E',16:'#E9814B',32:'#E66838',64:'#E64E2F',128:'#D93F22',256:'#C53318',512:'#A9280F',1024:'#8A200B',2048:'#6B1806'};

  for(let i=0;i<N*N;i++){
    const c = document.createElement('div');
    c.className = 'g2048-cell';
    bgEl.appendChild(c);
  }

  let cells, score, best = 0, over, busy = false, idc = 0;

  function emptyGrid(){ return Array.from({length:N},()=>Array(N).fill(null)); }
  function allTiles(){ const out=[]; cells.forEach(r=>r.forEach(t=>{ if(t) out.push(t); })); return out; }

  /* ---------- geometria ---------- */
  function tileSize(){
    const inner = tilesEl.clientWidth || (boardEl.clientWidth - GAP*2);
    return (inner - GAP*(N-1)) / N;
  }
  function place(el, r, c, size){
    el.style.width  = size+'px';
    el.style.height = size+'px';
    el.style.transform = `translate(${c*(size+GAP)}px, ${r*(size+GAP)}px)`;
  }
  function fontFor(v, size){
    const digits = String(v).length;
    const base = size*0.42;
    return (digits>=4 ? base*0.62 : digits===3 ? base*0.78 : base) + 'px';
  }
  function paint(tile, size){
    const f = tile.el.firstChild;
    f.textContent = tile.v;
    f.style.background = palette[tile.v] || '#6B1806';
    f.style.color = tile.v>=8 ? '#ffffff' : '#6B615A';
    f.style.fontSize = fontFor(tile.v, size);
  }

  /* ---------- tiles ---------- */
  function makeTile(r, c, v){
    const el = document.createElement('div');
    el.className = 'g2048-tile';
    const face = document.createElement('div');
    face.className = 'g2048-face appear';
    el.appendChild(face);
    tilesEl.appendChild(el);
    const t = {id:++idc, r, c, v, el};
    const size = tileSize();
    place(el, r, c, size);
    paint(t, size);
    return t;
  }
  function addTile(){
    const empties = [];
    cells.forEach((row,r)=>row.forEach((t,c)=>{ if(!t) empties.push([r,c]); }));
    if(!empties.length) return;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    cells[r][c] = makeTile(r, c, Math.random()<tune.four ? 4 : 2);
  }
  function syncPositions(){
    const size = tileSize();
    allTiles().forEach(t=>place(t.el, t.r, t.c, size));
  }

  /* ---------- movimento ---------- */
  function farthest(r, c, vec){
    let pr=r, pc=c, nr=r+vec[0], nc=c+vec[1];
    while(nr>=0 && nr<N && nc>=0 && nc<N && !cells[nr][nc]){
      pr=nr; pc=nc; nr+=vec[0]; nc+=vec[1];
    }
    return {fr:pr, fc:pc, nr, nc};
  }
  function move(dir){
    if(over || busy) return;
    const vec = {up:[-1,0], down:[1,0], left:[0,-1], right:[0,1]}[dir];
    const idx = [...Array(N).keys()];
    const rOrder = vec[0]===1 ? [...idx].reverse() : idx;
    const cOrder = vec[1]===1 ? [...idx].reverse() : idx;
    const size = tileSize();
    let moved = false;
    const dying = [], mergedTiles = [];
    allTiles().forEach(t=>{ t.merged = false; });

    for(const r of rOrder){
      for(const c of cOrder){
        const t = cells[r][c];
        if(!t) continue;
        const {fr, fc, nr, nc} = farthest(r, c, vec);
        const next = (nr>=0 && nr<N && nc>=0 && nc<N) ? cells[nr][nc] : null;
        if(next && next.v===t.v && !next.merged){
          cells[r][c] = null;
          next.v *= 2;
          next.merged = true;
          score += next.v;
          t.r = nr; t.c = nc;
          place(t.el, nr, nc, size);        // desliza por cima e some
          dying.push(t);
          mergedTiles.push(next);
          moved = true;
        } else if(fr!==r || fc!==c){
          cells[r][c] = null;
          cells[fr][fc] = t;
          t.r = fr; t.c = fc;
          place(t.el, fr, fc, size);        // desliza
          moved = true;
        }
      }
    }
    if(!moved) return;

    busy = true;
    setTimeout(()=>{
      dying.forEach(t=>t.el.remove());
      mergedTiles.forEach(t=>{
        paint(t, size);
        const f = t.el.firstChild;
        f.classList.remove('merged'); void f.offsetWidth; f.classList.add('merged');
      });
      score = score;
      updateScore();
      addTile();
      busy = false;
      checkOver();
    }, ANIM);
  }
  function canMove(){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      if(!cells[r][c]) return true;
      const v = cells[r][c].v;
      if(c<N-1 && cells[r][c+1] && cells[r][c+1].v===v) return true;
      if(r<N-1 && cells[r+1][c] && cells[r+1][c].v===v) return true;
    }
    return false;
  }
  const recId = '2048-'+N;
  function checkOver(){
    if(!canMove()){
      over=true;
      root.querySelector('#g2048Msg').textContent = 'Sem mais jogadas! Pontos finais: '+score;
      recSubmit(recId, score);
      recBarUpdate(root, recId, 'max');
    }
  }
  function updateScore(){
    root.querySelector('#g2048Score').textContent = score;
    if(score>best){ best = score; root.querySelector('#g2048Best').textContent = best; }
  }

  function key(e){
    const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
  }
  window.addEventListener('keydown', key);
  let ts=null;
  boardEl.addEventListener('touchstart', e=>{ ts={x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
  boardEl.addEventListener('touchmove', e=>{ if(ts) e.preventDefault(); }, {passive:false});
  boardEl.addEventListener('touchend', e=>{
    if(!ts) return;
    const dx=e.changedTouches[0].clientX-ts.x, dy=e.changedTouches[0].clientY-ts.y;
    ts=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  });
  const unwirePad = wirePad(root, d=>move(d));
  root.querySelector('#g2048Reset').addEventListener('click', reset);
  root.querySelector('#g2048How').addEventListener('click', ()=>toast('Junte dois números iguais para somá-los! ✦'));

  function reset(){
    tilesEl.innerHTML = '';
    cells = emptyGrid();
    score = 0; over = false; busy = false;
    root.querySelector('#g2048Msg').textContent = '';
    addTile(); addTile();
    updateScore();
    recBarUpdate(root, recId, 'max');
  }
  const onResize = ()=>syncPositions();
  window.addEventListener('resize', onResize);
  reset();
  requestAnimationFrame(syncPositions);   // posiciona certo depois do layout
  return ()=>{ window.removeEventListener('keydown', key); window.removeEventListener('resize', onResize); unwirePad(); };
});

const WAM_SPEED = {facil:1000, medio:700, dificil:520, extremo:360};
const WAM_CRITTERS = [

  {name:'piscando', color:'#26D0A0', face:()=>`
    <path d="M27 46 Q35 38 43 46" stroke="#08322B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="65" cy="46" r="7" fill="#08322B"/>

  {name:'apaixonado', color:'#FF74B1', face:()=>`

    <path d="M65 40 C61 34 52 36 52 43 C52 51 65 58 65 58 C65 58 78 51 78 43 C78 36 69 34 65 40Z" fill="#C93A6E"/>
    <path d="M35 70 Q50 82 65 70" stroke="#8a1d55" stroke-width="6" fill="none" stroke-linecap="round"/>`}
];
function critterSVG(cr){
  return `<svg viewBox="0 0 100 100"><path d="M15 100 C15 40 30 8 50 8 C70 8 85 40 85 100 Z" fill="${cr.color}"/>${cr.face()}</svg>`;
}
const initWAM = withSetup({
  modes:[{id:'solo',label:t('setup_1p')},{id:'duo',label:t('setup_2p')}],
  hint:'Muda a rapidez com que os bichinhos aparecem.',
  duoHint:'Cada jogador tem 20 segundos. Quem fizer mais pontos vence.'
}, function(root, opts){
  const popMs = WAM_SPEED[opts.diff] || 700;
  const duo = opts.mode==='duo';
  const roundTime = duo ? 20 : 30;
  root.innerHTML = `
    ${diffTagHTML(opts)}
    <div class="g-row">
      <span class="g-stat" id="wamScore">Pontos: 0</span>
      <span class="g-stat" id="wamTime">Tempo: ${roundTime}s</span>
    </div>
    ${duo?'<div class="turn-banner turn-p1" id="wamTurn">Vez do Jogador 1</div>':''}
    ${!duo?recBarHTML():''}
    <div class="wam-board" id="wamBoard"></div>
    <div class="g-msg" id="wamMsg">Toque em "Começar" para jogar</div>
    <div class="g-row" style="justify-content:center;"><button class="g-btn" id="wamStart">Começar</button></div>
  `;
  wireDiffTag(root, opts);
  const boardEl  = root.querySelector('#wamBoard');
  const scoreEl  = root.querySelector('#wamScore');
  const timeEl   = root.querySelector('#wamTime');
  const msgEl    = root.querySelector('#wamMsg');
  const startBtn = root.querySelector('#wamStart');
  const turnEl   = root.querySelector('#wamTurn');
  const holes = [];
  for(let i=0;i<9;i++){
    const h = document.createElement('div');
    h.className='wam-hole';
    h.innerHTML = '<div class="mole"></div>';
    boardEl.appendChild(h);
    holes.push(h);
  }
  let score, timeLeft, popTimer, countdown, activeHole, running;
  let player = 0, scores = [0,0];

  function pop(){
    if(activeHole) activeHole.classList.remove('up');
    activeHole = holes[Math.floor(Math.random()*holes.length)];
    const critter = WAM_CRITTERS[Math.floor(Math.random()*WAM_CRITTERS.length)];
    activeHole.querySelector('.mole').innerHTML = critterSVG(critter);
    activeHole.classList.add('up');
  }
  function hit(h){
    if(!running) return;
    if(h.classList.contains('up')){
      h.classList.remove('up');
      score++;
      scoreEl.textContent = 'Pontos: '+score;
    }
  }
  holes.forEach(h=>h.addEventListener('click', ()=>hit(h)));


  function stopTimers(){
    clearInterval(popTimer); clearInterval(countdown);
    running=false;
    if(activeHole) activeHole.classList.remove('up');
  }
  function setTurnBanner(){
    if(!turnEl) return;
    turnEl.className = 'turn-banner ' + (player===0?'turn-p1':'turn-p2');
    turnEl.textContent = 'Vez do Jogador '+(player+1);
  }
  function endRound(){
    stopTimers();
    if(!duo){
      msgEl.textContent = 'Fim de jogo! Pontos: '+score;
      startBtn.textContent = 'Jogar de novo';
      recSubmit('wam', score);
      recBarUpdate(root, 'wam', 'max');
      return;
    }
    scores[player] = score;
    if(player===0){
      player = 1;
      setTurnBanner();
      msgEl.textContent = `Jogador 1 fez ${scores[0]} ponto(s). Passe para o Jogador 2!`;
      startBtn.textContent = 'Vez do Jogador 2';
    } else {
      const msg = scores[0]===scores[1] ? `Empate em ${scores[0]}! 🤝`
        : `Jogador ${scores[0]>scores[1]?1:2} venceu! (${scores[0]} x ${scores[1]}) 🎉`;
      msgEl.textContent = msg;
      startBtn.textContent = 'Jogar de novo';
      player = 0;
      setTurnBanner();
    }
  }
  function runRound(){
    score=0; timeLeft=roundTime; running=true;
    scoreEl.textContent='Pontos: 0';
    timeEl.textContent='Tempo: '+roundTime+'s';
    msgEl.textContent='';
    startBtn.textContent='Reiniciar';
    clearInterval(popTimer); clearInterval(countdown);
    popTimer = setInterval(pop, popMs);
    countdown = setInterval(()=>{
      timeLeft--;
      timeEl.textContent = 'Tempo: '+timeLeft+'s';
      if(timeLeft<=0) endRound();
    },1000);
  }
  function onStart(){
    if(duo && !running && player===0) scores=[0,0];
    setTurnBanner();
    runRound();
  }
  startBtn.addEventListener('click', onStart);
  setTurnBanner();
  if(!duo) recBarUpdate(root, 'wam', 'max');
  return ()=>{ stopTimers(); };
});

/* ============================================================
   GAME 7: CORRIDA TURBO (lane dodge)
============================================================ */
const RACE_TUNE = {
  facil:  {speed:2.6, gap:52, ramp:0.06},
  medio:  {speed:3.4, gap:42, ramp:0.12},
  dificil:{speed:4.3, gap:34, ramp:0.18},
  extremo:{speed:5.4, gap:27, ramp:0.26}
};
const initRace = withSetup({hint:'Muda a velocidade e o trânsito na pista.'}, function(root, opts){
  const tune = RACE_TUNE[opts.diff] || RACE_TUNE.medio;
  root.innerHTML = `
    ${diffTagHTML(opts)}
    <div class="g-row" style="justify-content:center;"><span class="g-stat" id="raceScore">Pontos: 0</span></div>
    ${recBarHTML()}
    <div class="snake-wrap"><canvas id="raceCanvas" width="240" height="360"></canvas></div>
    <div class="g-msg" id="raceMsg">Toque nos botões para desviar</div>
    ${padHTML('lr')}
    <p class="pad-hint">Também dá para tocar nos lados da pista</p>
    <div class="g-row" style="justify-content:center;margin-top:10px;"><button class="g-btn" id="raceReset">Reiniciar</button></div>
  `;
  const canvas = root.querySelector('#raceCanvas');
  const ctx = canvas.getContext('2d');
  const laneW = canvas.width/3;
  const carW = 40, carH = 64;
  let player, obstacles, score, speed, spawnCounter, running, over, timer, roadOffset;
  const CAR_PALETTE = ['#FF6B5B','#3DA9FC','#FFC93C','#9B6DFF','#26D0A0','#FF9F45'];

  function laneX(lane){ return lane*laneW + laneW/2; }

  function place(){
    player = {lane:1, y: canvas.height-80};
    obstacles = [];
    score = 0; speed = tune.speed; spawnCounter = 18; running=false; over=false; roadOffset=0;
    root.querySelector('#raceScore').textContent = 'Pontos: 0';
    root.querySelector('#raceMsg').textContent = 'Use ◀ ▶ para desviar';
    recBarUpdate(root, 'race', 'max');
    draw();
  }
  function spawn(){
    const lane = Math.floor(Math.random()*3);
    const color = CAR_PALETTE[Math.floor(Math.random()*CAR_PALETTE.length)];
    obstacles.push({lane, y:-carH, color});
  }

  /* carro visto de cima: carroceria, para-brisa, rodas e faróis/lanternas */
  function drawCar(cx, y, color, facingUp){
    const w = carW, h = carH;
    const x = cx - w/2;
    ctx.save();
    // sombra
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    roundRect(ctx, x+3, y+5, w, h, 11);
    ctx.fill();
    // carroceria
    ctx.fillStyle = color;
    roundRect(ctx, x, y, w, h, 11);
    ctx.fill();
    // capô/traseira (parte mais estreita na ponta de trás)
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    roundRect(ctx, x+3, facingUp ? y+h*0.62 : y+h*0.06, w-6, h*0.30, 6);
    ctx.fill();
    // para-brisa
    ctx.fillStyle = 'rgba(200,230,255,.85)';
    roundRect(ctx, x+6, facingUp ? y+h*0.16 : y+h*0.56, w-12, h*0.26, 5);
    ctx.fill();
    // teto
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    roundRect(ctx, x+7, y+h*0.40, w-14, h*0.22, 5);
    ctx.fill();
    // rodas
    ctx.fillStyle = '#1a1a1a';
    const wheelW = 6, wheelH = h*0.22;
    ctx.fillRect(x-2, y+h*0.12, wheelW, wheelH);
    ctx.fillRect(x+w-4, y+h*0.12, wheelW, wheelH);
    ctx.fillRect(x-2, y+h*0.62, wheelW, wheelH);
    ctx.fillRect(x+w-4, y+h*0.62, wheelW, wheelH);
    // faróis (na frente, de acordo com o sentido)
    ctx.fillStyle = facingUp ? '#FFF6C8' : '#FF5A4E';
    const ly = facingUp ? y+3 : y+h-8;
    ctx.fillRect(x+4, ly, 6, 5);
    ctx.fillRect(x+w-10, ly, 6, 5);
    ctx.restore();
  }

  function draw(){
    // pista
    ctx.fillStyle = '#274b40';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // acostamento com listras (estilo zebrado de corrida), rolando com a pista
    const stripe = 22;
    for(const side of [0, canvas.width-7]){
      ctx.save();
      ctx.beginPath();
      ctx.rect(side, 0, 7, canvas.height);
      ctx.clip();
      const off = roadOffset % (stripe*2);
      for(let y=-stripe*2; y<canvas.height+stripe*2; y+=stripe*2){
        ctx.fillStyle = '#eafff8';
        ctx.fillRect(side, y+off, 7, stripe);
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(side, y+off+stripe, 7, stripe);
      }
      ctx.restore();
    }
    // faixas das pistas
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 3;
    ctx.setLineDash([16,14]);
    for(let l=1;l<3;l++){
      ctx.beginPath();
      ctx.moveTo(l*laneW, -20+ (roadOffset%30));
      ctx.lineTo(l*laneW, canvas.height);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // carros que vêm no sentido contrário
    obstacles.forEach(o=>{
      drawCar(laneX(o.lane), o.y, o.color, false);
    });
    // carro do jogador
    drawCar(laneX(player.lane), player.y, '#eafff8', true);
  }
  function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
  }
  function tick(){
    roadOffset += speed;
    obstacles.forEach(o=>o.y+=speed);
    let passed = 0;
    obstacles = obstacles.filter(o=>{
      if(o.y>canvas.height){ passed++; return false; }
      return true;
    });
    if(passed){ score+=passed; root.querySelector('#raceScore').textContent = 'Pontos: '+score; }
    spawnCounter--;
    if(spawnCounter<=0){ spawn(); spawnCounter = Math.max(tune.gap-14, tune.gap-Math.floor(score/2)); }
    speed = tune.speed + Math.min(5, score*tune.ramp);
    for(const o of obstacles){
      if(o.lane===player.lane && o.y+carH>player.y && o.y<player.y+carH){
        over=true; running=false; clearInterval(timer);
        root.querySelector('#raceMsg').textContent = 'Bateu! Pontos: '+score;
        recSubmit('race', score);
        recBarUpdate(root, 'race', 'max');
        break;
      }
    }
    draw();
  }
  function start(){
    if(running||over) return;
    running=true;
    root.querySelector('#raceMsg').textContent = '';
    timer = setInterval(tick, 32);
  }
  function moveTo(dir){
    player.lane = Math.max(0, Math.min(2, player.lane+dir));
    start();
  }
  function key(e){
    if(e.key==='ArrowLeft'){ e.preventDefault(); moveTo(-1); }
    if(e.key==='ArrowRight'){ e.preventDefault(); moveTo(1); }
  }
  window.addEventListener('keydown', key);
  let lastTouchAt = 0;
  function tapAt(clientX){
    const rect = canvas.getBoundingClientRect();
    const x = clientX-rect.left;
    moveTo(x < rect.width/2 ? -1 : 1);
  }
  canvas.addEventListener('click', e=>{
    if(Date.now()-lastTouchAt < 700) return; // ignore click synthesized after a tap
    tapAt(e.clientX);
  });
  canvas.addEventListener('touchstart', e=>{
    e.preventDefault();
    lastTouchAt = Date.now();
    tapAt(e.touches[0].clientX);
  }, {passive:false});
  wireDiffTag(root, opts);
  const unwirePad = wirePad(root, d=>moveTo(d==='left'?-1:1));
  root.querySelector('#raceReset').addEventListener('click', ()=>{ clearInterval(timer); place(); });
  place();
  return ()=>{ clearInterval(timer); window.removeEventListener('keydown', key); unwirePad(); };
});

/* ============================================================
   GAME 8: QUEBRA-BLOCO (Breakout)
============================================================ */
const BRK_TUNE = {
  facil:  {sp:2.2, pad:84, rows:3, lives:5},
  medio:  {sp:2.9, pad:64, rows:4, lives:3},
  dificil:{sp:3.7, pad:48, rows:5, lives:2},
  extremo:{sp:4.6, pad:36, rows:6, lives:1}
};
const initBreakout = withSetup({hint:'Muda a velocidade da bola e o tamanho da raquete.'}, function(root, opts){
  const tune = BRK_TUNE[opts.diff] || BRK_TUNE.medio;
  root.innerHTML = `
    ${diffTagHTML(opts)}
    <div class="g-row"><span class="g-stat" id="brkScore">Pontos: 0</span><span class="g-stat" id="brkLives">Vidas: ${tune.lives}</span></div>
    ${recBarHTML()}
    <div class="snake-wrap"><canvas id="brkCanvas" width="260" height="320"></canvas></div>
    <div class="g-msg" id="brkMsg">Toque ou arraste para começar</div>
    ${padHTML('lr')}
    <p class="pad-hint">Segure os botões ou arraste o dedo na tela</p>
    <div class="g-row" style="justify-content:center;margin-top:10px;"><button class="g-btn" id="brkReset">Reiniciar</button></div>
  `;
  const canvas = root.querySelector('#brkCanvas');
  const ctx = canvas.getContext('2d');
  const rows=tune.rows, cols=6, margin=14, gap=6;
  const bw = (canvas.width-margin*2-gap*(cols-1))/cols, bh=16;
  const rowColors = ['#FF6B5B','#FF9F45','#FFC93C','#26D0A0','#3DA9FC','#9B6DFF'];
  let paddle, ball, bricks, score, lives, running, over, raf;

  function initBricks(){
    bricks=[];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      bricks.push({x:margin+c*(bw+gap), y:margin+r*(bh+gap), w:bw, h:bh, alive:true, color:rowColors[r]});
    }
  }
  function resetBall(){
    ball = {x:canvas.width/2, y:canvas.height-46, vx:(Math.random()<0.5?-1:1)*tune.sp*0.85, vy:-tune.sp, r:6};
    running = false;
  }
  function place(){
    paddle = {x:canvas.width/2-tune.pad/2, y:canvas.height-16, w:tune.pad, h:9};
    initBricks(); score=0; lives=tune.lives; over=false;
    root.querySelector('#brkScore').textContent='Pontos: 0';
    root.querySelector('#brkLives').textContent='Vidas: '+tune.lives;
    root.querySelector('#brkMsg').textContent='Toque ou arraste para começar';
    resetBall();
    recBarUpdate(root, 'breakout', 'max');
    draw();
  }
  function draw(){
    ctx.fillStyle = '#0c2b23';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    bricks.forEach(b=>{
      if(!b.alive) return;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(b.x,b.y,b.w,b.h,4) : ctx.rect(b.x,b.y,b.w,b.h);
      ctx.fill();
    });
    ctx.fillStyle = '#eafff8';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,5) : ctx.rect(paddle.x,paddle.y,paddle.w,paddle.h);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
  function loop(){
    if(running && !over){
      ball.x += ball.vx; ball.y += ball.vy;
      if(ball.x<ball.r || ball.x>canvas.width-ball.r) ball.vx*=-1;
      if(ball.y<ball.r) ball.vy*=-1;
      if(ball.vy>0 && ball.y+ball.r>=paddle.y && ball.x>paddle.x && ball.x<paddle.x+paddle.w){
        ball.vy*=-1;
        const hit = (ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
        ball.vx = hit*3.2;
      }
      bricks.forEach(b=>{
        if(b.alive && ball.x+ball.r>b.x && ball.x-ball.r<b.x+b.w && ball.y+ball.r>b.y && ball.y-ball.r<b.y+b.h){
          b.alive=false; ball.vy*=-1; score++;
          root.querySelector('#brkScore').textContent='Pontos: '+score;
        }
      });
      if(ball.y>canvas.height){
        lives--;
        root.querySelector('#brkLives').textContent='Vidas: '+lives;
        if(lives<=0){
          over=true;
          root.querySelector('#brkMsg').textContent='Fim de jogo! Pontos: '+score;
          recSubmit('breakout', score);
          recBarUpdate(root, 'breakout', 'max');
        } else {
          resetBall();
          root.querySelector('#brkMsg').textContent='Toque para lançar de novo';
        }
      }
      if(bricks.every(b=>!b.alive)){
        over=true;
        root.querySelector('#brkMsg').textContent='Você quebrou tudo! 🎉 Pontos: '+score;
        recSubmit('breakout', score);
        recBarUpdate(root, 'breakout', 'max');
      }
    }
    draw();
    raf = requestAnimationFrame(loop);
  }
  function movePaddle(clientX){
    const rect = canvas.getBoundingClientRect();
    const x = (clientX-rect.left) * (canvas.width/rect.width);
    paddle.x = Math.max(0, Math.min(canvas.width-paddle.w, x-paddle.w/2));
    launch();
  }
  function launch(){
    if(!running && !over){ running=true; root.querySelector('#brkMsg').textContent=''; }
  }
  canvas.addEventListener('mousemove', e=>movePaddle(e.clientX));
  canvas.addEventListener('touchmove', e=>{ e.preventDefault(); movePaddle(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); movePaddle(e.touches[0].clientX); }, {passive:false});
  canvas.addEventListener('click', launch);
  function key(e){
    if(e.key==='ArrowLeft'){ paddle.x=Math.max(0,paddle.x-24); launch(); }
    if(e.key==='ArrowRight'){ paddle.x=Math.min(canvas.width-paddle.w,paddle.x+24); launch(); }
  }
  window.addEventListener('keydown', key);
  const unwirePad = wirePad(root, d=>{
    const step = 22;
    paddle.x = d==='left' ? Math.max(0, paddle.x-step)
                          : Math.min(canvas.width-paddle.w, paddle.x+step);
    launch();
  }, {repeat:60});
  wireDiffTag(root, opts);
  root.querySelector('#brkReset').addEventListener('click', place);
  place();
  raf = requestAnimationFrame(loop);
  return ()=>{ cancelAnimationFrame(raf); window.removeEventListener('keydown', key); unwirePad(); };
});

/* ============================================================
   GAME 9: LABIRINTO (maze)
============================================================ */
const MAZE_SIZE = {facil:6, medio:8, dificil:11, extremo:15};
const MAZE_VIS = {facil:Infinity, medio:Infinity, dificil:4.5, extremo:3.5};
const initMaze = withSetup({hint:t('maze_hint')}, function(root, opts){
  root.innerHTML = `
    ${diffTagHTML(opts)}
    <div class="g-row"><span class="g-stat" id="mazeTime">${t('maze_time',{n:0})}</span></div>
    <div class="snake-wrap"><canvas id="mazeCanvas" width="266" height="266"></canvas></div>
    <div class="g-msg" id="mazeMsg">${t('maze_goal')}</div>
    ${padHTML()}
    <p class="pad-hint">${t('maze_pad_hint')}</p>
    <div class="g-row" style="justify-content:center;margin-top:10px;"><button class="g-btn" id="mazeReset">${t('maze_new')}</button></div>
  `;
  const canvas = root.querySelector('#mazeCanvas');
  const ctx = canvas.getContext('2d');
  const n = MAZE_SIZE[opts.diff] || 8; // cells per side
  const visRadius = MAZE_VIS[opts.diff] ?? Infinity;
  const gridSize = 2*n+1;
  const cell = canvas.width/gridSize;
  let maze, player, exit, timer, seconds, done, key, revealed;

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function generate(){
    const g = Array.from({length:gridSize}, ()=>Array(gridSize).fill(1));
    function carve(cx,cy,lastDir){
      g[cy][cx]=0;
      let dirs = shuffle([[0,-2],[0,2],[-2,0],[2,0]]);
      // viés: tende a continuar na mesma direção, criando corredores mais longos
      // e becos sem saída mais enganosos (mais difícil de perceber visualmente)
      if(lastDir && Math.random()<0.6){
        dirs = [lastDir, ...dirs.filter(d=>!(d[0]===lastDir[0] && d[1]===lastDir[1]))];
      }
      for(const [dx,dy] of dirs){
        const nx=cx+dx, ny=cy+dy;
        if(ny>0 && ny<gridSize-1 && nx>0 && nx<gridSize-1 && g[ny][nx]===1){
          g[cy+dy/2][cx+dx/2]=0;
          carve(nx,ny,[dx,dy]);
        }
      }
    }
    carve(1,1,null);
    return g;
  }
  function updateRevealed(){
    if(visRadius===Infinity) return;
    for(let y=Math.max(0,player.y-Math.ceil(visRadius)); y<=Math.min(gridSize-1,player.y+Math.ceil(visRadius)); y++){
      for(let x=Math.max(0,player.x-Math.ceil(visRadius)); x<=Math.min(gridSize-1,player.x+Math.ceil(visRadius)); x++){
        if(Math.hypot(x-player.x, y-player.y)<=visRadius) revealed[y][x] = true;
      }
    }
  }
  function draw(){
    ctx.fillStyle = '#08201a';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let y=0;y<gridSize;y++) for(let x=0;x<gridSize;x++){
      if(maze[y][x]===0 && (visRadius===Infinity || revealed[y][x])){
        ctx.fillStyle = '#e7fbf3';
        ctx.fillRect(x*cell, y*cell, cell+0.5, cell+0.5);
      }
    }
    if(visRadius===Infinity || revealed[exit.y][exit.x]){
      ctx.fillStyle = '#FFC93C';
      ctx.beginPath();
      ctx.arc(exit.x*cell+cell/2, exit.y*cell+cell/2, cell*0.32, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = '#26D0A0';
    ctx.beginPath();
    ctx.arc(player.x*cell+cell/2, player.y*cell+cell/2, cell*0.34, 0, Math.PI*2);
    ctx.fill();
  }
  function place(){
    maze = generate();
    player = {x:1,y:1};
    exit = {x:gridSize-2, y:gridSize-2};
    revealed = Array.from({length:gridSize}, ()=>Array(gridSize).fill(false));
    updateRevealed();
    seconds = 0; done=false;
    root.querySelector('#mazeTime').textContent = t('maze_time',{n:0});
    root.querySelector('#mazeMsg').textContent = t('maze_goal');
    clearInterval(timer);
    timer = setInterval(()=>{
      if(!done){ seconds++; root.querySelector('#mazeTime').textContent = t('maze_time',{n:seconds}); }
    },1000);
    draw();
  }
  function tryMove(dx,dy){
    if(done) return;
    const nx = player.x+dx, ny = player.y+dy;
    if(maze[ny] && maze[ny][nx]===0){
      player.x = nx; player.y = ny;
      updateRevealed();
      draw();
      if(player.x===exit.x && player.y===exit.y){
        done = true;
        root.querySelector('#mazeMsg').textContent = t('maze_win',{n:seconds});
      }
    }
  }
  key = e=>{
    const map = {ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
    if(map[e.key]){ e.preventDefault(); tryMove(...map[e.key]); }
  };
  window.addEventListener('keydown', key);
  let ts=null;
  canvas.addEventListener('touchstart', e=>{ ts={x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
  canvas.addEventListener('touchend', e=>{
    if(!ts) return;
    const dx=e.changedTouches[0].clientX-ts.x, dy=e.changedTouches[0].clientY-ts.y;
    ts=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<16) return;
    if(Math.abs(dx)>Math.abs(dy)) tryMove(dx>0?1:-1, 0);
    else tryMove(0, dy>0?1:-1);
  });
  wireDiffTag(root, opts);
  const padDirs = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
  const unwirePad = wirePad(root, d=>tryMove(...padDirs[d]), {repeat:150});
  root.querySelector('#mazeReset').addEventListener('click', place);
  place();
  return ()=>{ clearInterval(timer); window.removeEventListener('keydown', key); unwirePad(); };
});

/* ============================================================

const FUT_TIMING = {

const initFutebol = withSetup({hint:'Muda o goleiro/batedor adversário e a velocidade da barrinha de tempo.'}, function(root, opts){
  const tune = FUT_TUNE[opts.diff] || FUT_TUNE.medio;

    {flag:'🇳🇱', name:'Holanda'},

  ];
  const zonePct = [16, 50, 84];
  const zoneArrow = ['⬅️','⬆️','➡️'];

  function kickerFigure(){
