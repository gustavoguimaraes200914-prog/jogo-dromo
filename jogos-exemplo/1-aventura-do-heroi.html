<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Aventura do Herói</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2f6b3a;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="tela"></canvas>
<script>
/* ============================================================
   AVENTURA DO HERÓI
   O herói é o PERSONAGEM DO KODA de quem está jogando (a roupa, o cabelo, tudo que a pessoa escolheu).
   Pegue as gemas e fuja das gosmas! A cada 6 gemas o nível sobe.
   Usa do Koda: KODA.jogador (o herói andando nas 4 direções), KODA.pontuar (ranking) e KODA.salvar (recorde).
   Funciona também fora do Koda (aí o herói é um bonequinho desenhado aqui).
   ============================================================ */
(function () {
  'use strict';
  var tela = document.getElementById('tela'), ctx = tela.getContext('2d');
  var KODA = window.KODA || {};   // se o jogo abrir fora do Koda, KODA fica vazio e o jogo usa os desenhos de reserva

  /* ---------- tamanho da tela ---------- */
  var L = 0, A = 0, escala = 1, fundo = null;
  function ajustar() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    L = window.innerWidth; A = window.innerHeight;
    tela.width = Math.floor(L * dpr); tela.height = Math.floor(A * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    escala = Math.max(0.7, Math.min(1.4, Math.min(L, A) / 480));
    montarFundo(dpr);
    if (heroi) { heroi.x = Math.max(20, Math.min(L - 20, heroi.x)); heroi.y = Math.max(70, Math.min(A - 10, heroi.y)); }
  }
  window.addEventListener('resize', ajustar);

  /* ---------- números sempre iguais (sorteio com semente, pra o fundo não mudar a cada quadro) ---------- */
  var semente = 7;
  function sorteio() { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; }
  function aleatorio(a, b) { return a + Math.random() * (b - a); }

  /* ---------- sons feitos na hora ---------- */
  var audio = null;
  function som(nome) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      var n = { gema: [880, 1320, 0.12, 'square', 0.05], dano: [260, 90, 0.3, 'sawtooth', 0.09], nivel: [520, 1040, 0.35, 'triangle', 0.09],
                coracao: [600, 900, 0.2, 'sine', 0.09], fim: [440, 120, 0.7, 'triangle', 0.1] }[nome];
      if (!n) return;
      var o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
      o.type = n[3]; o.frequency.setValueAtTime(n[0], t); o.frequency.exponentialRampToValueAtTime(n[1], t + n[2]);
      g.gain.setValueAtTime(n[4], t); g.gain.exponentialRampToValueAtTime(0.001, t + n[2]);
      o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + n[2] + 0.03);
    } catch (e) {}
  }

  /* ---------- o que o Koda guarda por pessoa (o recorde) ---------- */
  var melhor = 0;
  try {
    var salvo = KODA.salvar && KODA.salvar.carregar();
    if (salvo && typeof salvo.melhor === 'number' && salvo.melhor >= 0 && salvo.melhor < 10000000) melhor = Math.floor(salvo.melhor);
  } catch (e) {}
  function guardarRecorde() { try { if (KODA.salvar) KODA.salvar.guardar({ melhor: melhor }); } catch (e) {} }
  function nomeDoJogador() { try { return (KODA.jogador && KODA.jogador.nome && KODA.jogador.nome()) || ''; } catch (e) { return ''; } }

  /* ---------- o herói: o personagem do Koda (ou um bonequinho, se o Koda não estiver por perto) ---------- */
  function desenharHeroi(px, py, h, direcao, andando, piscar) {
    // (px, py) = os pés do herói
    var w = h * 22 / 29;
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(px, py - 1, w * 0.42, h * 0.07, 0, 0, Math.PI * 2); ctx.fill();
    if (piscar) ctx.globalAlpha = 0.45;
    if (KODA.jogador && KODA.jogador.pronto && KODA.jogador.pronto()) {
      KODA.jogador.andar(ctx, px - w / 2, py - h, h, { direcao: direcao, andando: andando });
    } else {
      var balanco = andando ? Math.sin(Date.now() / 90) * 3 : 0;
      ctx.fillStyle = '#ff8a3d'; ctx.fillRect(px - w * 0.3, py - h * 0.55 + balanco * 0.2, w * 0.6, h * 0.42);
      ctx.fillStyle = '#3a5fd0'; ctx.fillRect(px - w * 0.3, py - h * 0.14, w * 0.25, h * 0.14 + balanco * 0.3); ctx.fillRect(px + w * 0.05, py - h * 0.14, w * 0.25, h * 0.14 - balanco * 0.3);
      ctx.fillStyle = '#ffd0a0'; ctx.beginPath(); ctx.arc(px, py - h * 0.72, h * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      if (direcao !== 'costas') { ctx.fillRect(px - h * 0.08 + (direcao === 'direita' ? 3 : direcao === 'esquerda' ? -3 : 0), py - h * 0.75, 3, 4); ctx.fillRect(px + h * 0.04 + (direcao === 'direita' ? 3 : direcao === 'esquerda' ? -3 : 0), py - h * 0.75, 3, 4); }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- estado do jogo ---------- */
  var estado = 'inicio';                    // inicio | jogando | fim
  var heroi = { x: 0, y: 0, dir: 'frente', andando: false, inv: 0 };
  var vidas = 3, pontos = 0, gemas = 0, nivel = 1, quadro = 0, tremor = 0, aviso = null, proxCoracao = 0;
  var listaGemas = [], limos = [], pedras = [], coracao = null, particulas = [];

  function raioPedra(p) { return p.r * escala; }
  function livre(x, y, folga) {
    for (var i = 0; i < pedras.length; i++) { var p = pedras[i]; if (Math.hypot(x - p.fx * L, y - p.fy * A) < raioPedra(p) + folga) return false; }
    return true;
  }
  function pontoLivre(distHeroi, folga) {
    for (var t = 0; t < 60; t++) {
      var x = aleatorio(40 * escala, L - 40 * escala), y = aleatorio(100 * escala, A - 30 * escala);
      if (livre(x, y, folga) && Math.hypot(x - heroi.x, y - heroi.y) > distHeroi) return { x: x, y: y };
    }
    return { x: L / 2, y: A / 2 };
  }
  function novoJogo() {
    vidas = 3; pontos = 0; gemas = 0; nivel = 1; quadro = 0; tremor = 0; aviso = null; proxCoracao = 900;
    heroi.x = L / 2; heroi.y = A * 0.62; heroi.dir = 'frente'; heroi.andando = false; heroi.inv = 60;
    particulas = []; listaGemas = []; limos = []; coracao = null;
    pedras = [];
    var n = 5;
    for (var i = 0; i < n; i++) {
      var fx, fy, ok = false, t = 0;
      while (!ok && t++ < 40) { fx = 0.1 + Math.random() * 0.8; fy = 0.25 + Math.random() * 0.68; ok = Math.hypot(fx * L - heroi.x, fy * A - heroi.y) > 120 * escala; }
      pedras.push({ fx: fx, fy: fy, r: 20 + Math.random() * 12, tipo: i % 2 });
    }
    for (var g = 0; g < 3; g++) soltarGema();
    for (var s = 0; s < 2; s++) soltarLimo();
    estado = 'jogando';
  }
  function soltarGema() { var p = pontoLivre(70 * escala, 24 * escala); listaGemas.push({ x: p.x, y: p.y, fase: Math.random() * 6 }); }
  function soltarLimo() {
    var p = pontoLivre(230 * escala, 30 * escala);
    limos.push({ x: p.x, y: p.y, vx: 0, vy: 0, mudar: 0, fase: Math.random() * 6 });
  }
  function faiscas(x, y, cor, n) {
    for (var i = 0; i < n; i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * 3.5; particulas.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, vida: 26 + Math.random() * 14, cor: cor }); }
  }
  function fimDeJogo() {
    estado = 'fim'; som('fim'); heroi.andando = false;
    var total = pontos;
    if (total > melhor) { melhor = total; guardarRecorde(); }
    try { if (KODA.pontuar) KODA.pontuar(total); } catch (e) {}   // manda os pontos pro ranking do Koda
    quadroFim = quadro;
  }
  var quadroFim = 0;

  /* ---------- controles: arrastar o dedo (joystick que aparece onde você toca), setas e WASD ---------- */
  var joy = { ativo: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
  var teclas = {};
  tela.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (x) {}
    if (estado === 'inicio') { novoJogo(); return; }
    if (estado === 'fim') { if (quadro - quadroFim > 45) novoJogo(); return; }
    joy.ativo = true; joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY;
    try { tela.setPointerCapture(e.pointerId); } catch (x) {}
  });
  tela.addEventListener('pointermove', function (e) { if (joy.ativo && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
  function soltou(e) { if (joy.ativo && e.pointerId === joy.id) joy.ativo = false; }
  tela.addEventListener('pointerup', soltou); tela.addEventListener('pointercancel', soltou);
  window.addEventListener('keydown', function (e) {
    teclas[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { if (estado === 'inicio') novoJogo(); else if (estado === 'fim' && quadro - quadroFim > 45) novoJogo(); }
  });
  window.addEventListener('keyup', function (e) { teclas[e.code] = false; });
  window.addEventListener('blur', function () { teclas = {}; joy.ativo = false; });

  function vetorDeEntrada() {
    var dx = 0, dy = 0;
    if (teclas.ArrowLeft || teclas.KeyA) dx -= 1;
    if (teclas.ArrowRight || teclas.KeyD) dx += 1;
    if (teclas.ArrowUp || teclas.KeyW) dy -= 1;
    if (teclas.ArrowDown || teclas.KeyS) dy += 1;
    if (joy.ativo) {
      var jx = joy.x - joy.ox, jy = joy.y - joy.oy, d = Math.hypot(jx, jy), max = 46 * escala;
      if (d > 8) { var m = Math.min(1, d / max); dx = jx / d * m; dy = jy / d * m; }
    }
    var tam = Math.hypot(dx, dy);
    if (tam > 1) { dx /= tam; dy /= tam; }
    return { x: dx, y: dy };
  }

  /* ---------- um passo do jogo (60 por segundo) ---------- */
  function empurrarParaFora(obj, raio) {
    for (var i = 0; i < pedras.length; i++) {
      var p = pedras[i], px = p.fx * L, py = p.fy * A, rp = raioPedra(p) + raio;
      var dx = obj.x - px, dy = obj.y - py, d = Math.hypot(dx, dy);
      if (d < rp && d > 0.001) { obj.x = px + dx / d * rp; obj.y = py + dy / d * rp; }
    }
  }
  function passo() {
    quadro++;
    for (var q = particulas.length - 1; q >= 0; q--) { var pa = particulas[q]; pa.x += pa.vx; pa.y += pa.vy; pa.vy += 0.1; if (--pa.vida <= 0) particulas.splice(q, 1); }
    if (tremor > 0) tremor--;
    if (aviso) { aviso.t--; if (aviso.t <= 0) aviso = null; }
    if (estado !== 'jogando') return;
    var v = vetorDeEntrada(), vel = 3.1 * escala;
    heroi.andando = Math.hypot(v.x, v.y) > 0.12;
    if (heroi.andando) {
      heroi.x += v.x * vel; heroi.y += v.y * vel;
      if (Math.abs(v.x) > Math.abs(v.y)) heroi.dir = v.x > 0 ? 'direita' : 'esquerda';
      else heroi.dir = v.y > 0 ? 'frente' : 'costas';
    }
    empurrarParaFora(heroi, 14 * escala);
    heroi.x = Math.max(18 * escala, Math.min(L - 18 * escala, heroi.x));
    heroi.y = Math.max(80 * escala, Math.min(A - 6, heroi.y));
    if (heroi.inv > 0) heroi.inv--;

    /* gemas */
    for (var i = listaGemas.length - 1; i >= 0; i--) {
      var g = listaGemas[i];
      if (Math.hypot(g.x - heroi.x, g.y - (heroi.y - 22 * escala)) < 30 * escala) {
        listaGemas.splice(i, 1); gemas++; pontos += 10 * nivel; som('gema'); faiscas(g.x, g.y, '#7CFFCB', 12);
        if (gemas % 6 === 0) { nivel++; som('nivel'); aviso = { txt: 'Nível ' + nivel + '!', t: 100 }; soltarLimo(); }
        soltarGema();
      }
    }
    /* coração */
    proxCoracao--;
    if (!coracao && proxCoracao <= 0 && vidas < 3) { var pc = pontoLivre(120 * escala, 24 * escala); coracao = { x: pc.x, y: pc.y }; }
    if (coracao && Math.hypot(coracao.x - heroi.x, coracao.y - (heroi.y - 22 * escala)) < 30 * escala) {
      vidas = Math.min(3, vidas + 1); coracao = null; proxCoracao = 1000; som('coracao'); faiscas(heroi.x, heroi.y - 30, '#ff6b81', 12);
    }
    /* gosmas */
    var vlimo = Math.min(2.3, 0.85 + 0.13 * nivel) * escala;
    for (var s = 0; s < limos.length; s++) {
      var m = limos[s], dh = Math.hypot(heroi.x - m.x, heroi.y - m.y);
      m.fase += 0.12;
      if (dh < 210 * escala && heroi.inv === 0) { m.vx = (heroi.x - m.x) / dh * vlimo * 1.1; m.vy = (heroi.y - m.y) / dh * vlimo * 1.1; }
      else {
        if (--m.mudar <= 0) { var a = Math.random() * 6.283; m.vx = Math.cos(a) * vlimo * 0.6; m.vy = Math.sin(a) * vlimo * 0.6; m.mudar = 50 + Math.random() * 70; }
      }
      m.x += m.vx; m.y += m.vy;
      empurrarParaFora(m, 16 * escala);
      if (m.x < 20 * escala || m.x > L - 20 * escala) { m.vx *= -1; m.x = Math.max(20 * escala, Math.min(L - 20 * escala, m.x)); }
      if (m.y < 90 * escala || m.y > A - 10) { m.vy *= -1; m.y = Math.max(90 * escala, Math.min(A - 10, m.y)); }
      if (heroi.inv === 0 && Math.hypot(heroi.x - m.x, (heroi.y - 16 * escala) - (m.y - 8 * escala)) < 28 * escala) {
        vidas--; heroi.inv = 100; tremor = 14; som('dano'); faiscas(heroi.x, heroi.y - 30, '#ff4d4d', 16);
        var ang = Math.atan2(heroi.y - m.y, heroi.x - m.x); heroi.x += Math.cos(ang) * 40 * escala; heroi.y += Math.sin(ang) * 40 * escala;
        if (vidas <= 0) { fimDeJogo(); return; }
      }
    }
  }

  /* ---------- desenho ---------- */
  function montarFundo(dpr) {
    fundo = document.createElement('canvas'); fundo.width = Math.floor(L * dpr); fundo.height = Math.floor(A * dpr);
    var c = fundo.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    semente = 7;
    var g = c.createLinearGradient(0, 0, 0, A); g.addColorStop(0, '#5fae4a'); g.addColorStop(1, '#3e8a3b');
    c.fillStyle = g; c.fillRect(0, 0, L, A);
    for (var i = 0; i < 70; i++) { c.fillStyle = 'rgba(30,90,40,' + (0.08 + sorteio() * 0.1) + ')'; c.beginPath(); c.ellipse(sorteio() * L, sorteio() * A, 30 + sorteio() * 60, 14 + sorteio() * 26, 0, 0, 6.283); c.fill(); }
    for (var f = 0; f < 60; f++) {
      var x = sorteio() * L, y = sorteio() * A, cor = ['#fff3a0', '#ffffff', '#ffb3d1', '#c9b3ff'][f % 4];
      c.fillStyle = cor; for (var k = 0; k < 4; k++) { c.beginPath(); c.arc(x + Math.cos(k * 1.57) * 3, y + Math.sin(k * 1.57) * 3, 2.2, 0, 6.283); c.fill(); }
      c.fillStyle = '#f0a020'; c.beginPath(); c.arc(x, y, 1.8, 0, 6.283); c.fill();
    }
    c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, 0, L, 62 * escala);
  }
  function texto(t, x, y, tam, cor, alinhar) {
    ctx.font = '800 ' + Math.round(tam * escala) + 'px system-ui, -apple-system, sans-serif';
    ctx.textAlign = alinhar || 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5 * escala; ctx.strokeStyle = 'rgba(0,30,10,.55)'; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y);
    ctx.fillStyle = cor || '#fff'; ctx.fillText(t, x, y);
  }
  function coracaoDesenho(x, y, s, cheio) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s / 20, s / 20);
    ctx.beginPath(); ctx.moveTo(10, 18); ctx.bezierCurveTo(-6, 8, 0, -4, 10, 4); ctx.bezierCurveTo(20, -4, 26, 8, 10, 18); ctx.closePath();
    ctx.fillStyle = cheio ? '#ff4d6d' : 'rgba(255,255,255,.28)'; ctx.fill(); ctx.restore();
  }
  function desenharGema(g) {
    var y = g.y + Math.sin(quadro / 14 + g.fase) * 3, r = 13 * escala;
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(g.x, g.y + r * 0.9, r * 0.8, r * 0.28, 0, 0, 6.283); ctx.fill();
    ctx.save(); ctx.shadowColor = '#7CFFCB'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#35e0b0'; ctx.beginPath(); ctx.moveTo(g.x, y - r); ctx.lineTo(g.x + r * 0.8, y); ctx.lineTo(g.x, y + r); ctx.lineTo(g.x - r * 0.8, y); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.beginPath(); ctx.moveTo(g.x, y - r); ctx.lineTo(g.x + r * 0.28, y - r * 0.05); ctx.lineTo(g.x, y + r * 0.35); ctx.lineTo(g.x - r * 0.28, y - r * 0.05); ctx.closePath(); ctx.fill();
  }
  function desenharLimo(m) {
    var esp = 1 + Math.sin(m.fase) * 0.08, r = 17 * escala;
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(m.x, m.y, r * 0.95, r * 0.3, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#8fd13a';
    ctx.beginPath(); ctx.moveTo(m.x - r, m.y); ctx.bezierCurveTo(m.x - r, m.y - r * 1.9 * esp, m.x + r, m.y - r * 1.9 * esp, m.x + r, m.y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(m.x - r * 0.4, m.y - r * 1.05 * esp, r * 0.22, r * 0.12, -0.5, 0, 6.283); ctx.fill();
    var ol = Math.sign(heroi.x - m.x) * 2;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(m.x - r * 0.38, m.y - r * 0.7, r * 0.26, 0, 6.283); ctx.arc(m.x + r * 0.38, m.y - r * 0.7, r * 0.26, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(m.x - r * 0.38 + ol, m.y - r * 0.68, r * 0.12, 0, 6.283); ctx.arc(m.x + r * 0.38 + ol, m.y - r * 0.68, r * 0.12, 0, 6.283); ctx.fill();
  }
  function desenharPedra(p) {
    var x = p.fx * L, y = p.fy * A, r = raioPedra(p);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x, y + r * 0.7, r * 1.05, r * 0.38, 0, 0, 6.283); ctx.fill();
    if (p.tipo === 0) {            // pedra
      ctx.fillStyle = '#9aa3ad'; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.8, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#b9c1ca'; ctx.beginPath(); ctx.ellipse(x - r * 0.25, y - r * 0.25, r * 0.55, r * 0.4, 0, 0, 6.283); ctx.fill();
    } else {                       // arvorezinha
      ctx.fillStyle = '#7a4b23'; ctx.fillRect(x - r * 0.18, y - r * 0.2, r * 0.36, r * 1.0);
      ctx.fillStyle = '#2e8b3a'; ctx.beginPath(); ctx.arc(x, y - r * 0.6, r * 0.95, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#3fb04a'; ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.85, r * 0.5, 0, 6.283); ctx.fill();
    }
  }
  function desenhar() {
    ctx.save();
    if (tremor > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
    ctx.drawImage(fundo, 0, 0, L, A);
    /* tudo ordenado de cima pra baixo, pra quem está mais embaixo ficar na frente */
    var itens = [];
    pedras.forEach(function (p) { itens.push({ y: p.fy * A, f: function () { desenharPedra(p); } }); });
    listaGemas.forEach(function (g) { itens.push({ y: g.y - 100, f: function () { desenharGema(g); } }); });
    if (coracao) itens.push({ y: coracao.y - 100, f: function () { coracaoDesenho(coracao.x - 14 * escala, coracao.y - 14 * escala + Math.sin(quadro / 10) * 3, 28 * escala, true); } });
    limos.forEach(function (m) { itens.push({ y: m.y, f: function () { desenharLimo(m); } }); });
    var h = 58 * escala;
    itens.push({ y: heroi.y, f: function () { desenharHeroi(heroi.x, heroi.y, h, heroi.dir, heroi.andando, heroi.inv > 0 && Math.floor(quadro / 5) % 2 === 0 && estado === 'jogando'); } });
    itens.sort(function (a, b) { return a.y - b.y; }).forEach(function (it) { it.f(); });
    particulas.forEach(function (p) { ctx.globalAlpha = Math.max(0, p.vida / 40); ctx.fillStyle = p.cor; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
    ctx.globalAlpha = 1;
    ctx.restore();

    if (estado === 'jogando') {
      for (var i = 0; i < 3; i++) coracaoDesenho(14 * escala + i * 30 * escala, 14 * escala, 24 * escala, i < vidas);
      texto('Gemas ' + gemas, L / 2, 30 * escala, 24);
      texto('Nível ' + nivel, L - 14 * escala, 22 * escala, 18, '#ffe07a', 'right');
      texto(pontos + ' pts', L - 14 * escala, 44 * escala, 15, '#fff', 'right');
      if (joy.ativo) {
        ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 46 * escala, 0, 6.283); ctx.stroke();
        var d = Math.hypot(joy.x - joy.ox, joy.y - joy.oy), mx = Math.min(d, 46 * escala), an = Math.atan2(joy.y - joy.oy, joy.x - joy.ox);
        ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(joy.ox + Math.cos(an) * mx, joy.oy + Math.sin(an) * mx, 20 * escala, 0, 6.283); ctx.fill();
      }
      if (aviso) { ctx.globalAlpha = Math.min(1, aviso.t / 30); texto(aviso.txt, L / 2, A * 0.3 - (100 - aviso.t) * 0.3, 40, '#ffe07a'); ctx.globalAlpha = 1; }
    }
    if (estado === 'inicio') {
      ctx.fillStyle = 'rgba(0,20,10,.5)'; ctx.fillRect(0, 0, L, A);
      texto('Aventura do Herói', L / 2, A * 0.2, 40);
      texto('Pegue as gemas e fuja das gosmas!', L / 2, A * 0.2 + 40 * escala, 17, '#d8ffe8');
      var nome = nomeDoJogador(); if (nome) texto('Bem-vindo, ' + nome + '!', L / 2, A * 0.2 + 70 * escala, 18, '#ffe07a');
      texto('Toque para jogar', L / 2, A * 0.8, 26, '#7CFFCB');
      texto('Arraste o dedo (ou use as setas e WASD)', L / 2, A * 0.8 + 32 * escala, 15, '#fff');
      if (melhor > 0) texto('Recorde: ' + melhor, L / 2, A * 0.8 + 58 * escala, 16, '#ffe07a');
    }
    if (estado === 'fim') {
      ctx.fillStyle = 'rgba(40,0,10,.55)'; ctx.fillRect(0, 0, L, A);
      texto('Fim de jogo!', L / 2, A * 0.3, 42);
      texto('Pontos: ' + pontos, L / 2, A * 0.3 + 48 * escala, 26);
      texto((pontos >= melhor && pontos > 0 ? 'Novo recorde: ' : 'Recorde: ') + melhor, L / 2, A * 0.3 + 82 * escala, 20, '#ffe07a');
      texto('Gemas: ' + gemas + '   Nível: ' + nivel, L / 2, A * 0.3 + 112 * escala, 17, '#d8ffe8');
      if (quadro - quadroFim > 45) texto('Toque para jogar de novo', L / 2, A * 0.72, 24, '#7CFFCB');
    }
  }

  /* ---------- o relógio: 60 passos por segundo em qualquer tela ---------- */
  function rodar() {
    var ultimo = performance.now(), acum = 0;
    function loop(t) {
      acum += Math.min(100, t - ultimo); ultimo = t;
      var n = 0;
      while (acum >= 16.667 && n++ < 6) { passo(); acum -= 16.667; }
      if (acum > 50) acum = 0;
      desenhar();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
  heroi.x = 0; ajustar();
  heroi.x = L / 2; heroi.y = A * 0.6;
  novoJogoVazio();
  function novoJogoVazio() { pedras = [{ fx: 0.2, fy: 0.45, r: 26, tipo: 1 }, { fx: 0.82, fy: 0.5, r: 22, tipo: 0 }, { fx: 0.7, fy: 0.85, r: 28, tipo: 1 }]; listaGemas = [{ x: L * 0.35, y: A * 0.5, fase: 0 }, { x: L * 0.62, y: A * 0.4, fase: 2 }]; limos = [{ x: L * 0.8, y: A * 0.68, vx: 0, vy: 0, mudar: 30, fase: 1 }]; }
  rodar();
})();
