<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kart Turbo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #3a8f3a; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #painel { position: fixed; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
  .tag { background: rgba(0,0,0,.55); border-radius: 10px; padding: 4px 10px; font-weight: 900; font-size: 15px; }
  #posicao { font-size: 28px; }
  #mapinha { position: fixed; top: 8px; right: 8px; width: 120px; height: 90px; background: rgba(0,0,0,.4); border-radius: 10px; }
  #semaforo { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; font-weight: 900; text-shadow: 0 6px 0 #0008; pointer-events: none; }
  #volante { position: fixed; bottom: 14px; left: 14px; display: flex; gap: 10px; }
  #pedais { position: fixed; bottom: 14px; right: 14px; display: flex; gap: 10px; }
  .bt { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,.18); border: 3px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; }
  .bt.on { background: rgba(255,230,80,.5); }
  #fim { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.7); }
  #fim.ver { display: flex; }
  #fim .caixa { background: #222; border: 3px solid #fc3; border-radius: 18px; padding: 20px; text-align: center; width: min(90vw, 380px); }
  #fim h1 { color: #fc3; margin-bottom: 8px; }
  #fim ol { text-align: left; margin: 10px 0 14px 24px; line-height: 1.6; }
  #fim button { font: inherit; font-weight: 900; font-size: 18px; padding: 12px 24px; border: 0; border-radius: 14px; background: #fc3; color: #222; cursor: pointer; }
</style>
</head>
<body>
<canvas id="pista"></canvas>
<div id="painel">
  <div class="tag" id="posicao">1º/6</div>
  <div class="tag" id="volta">Volta 1/3</div>
  <div class="tag" id="tempo">0:00.0</div>
  <div class="tag" id="pontosTxt">★ 0</div>
  <div class="tag" id="item">Item: —</div>
</div>
<canvas id="mapinha" width="240" height="180"></canvas>
<div id="semaforo"></div>
<div id="volante"><div class="bt" data-k="esq">◀</div><div class="bt" data-k="dir">▶</div></div>
<div id="pedais"><div class="bt" data-k="usar">★</div><div class="bt" data-k="freio">■</div><div class="bt" data-k="acel">▲</div></div>
<div id="fim"><div class="caixa"><h1>Chegada!</h1><div id="resultado"></div><button id="denovo">Correr de novo</button></div></div>

<script>
/* =====================================================================
   KART TURBO - corrida de 3 voltas contra 5 karts do computador
   Derrape nas curvas para encher o turbo. Caixas ? dão itens.
   ===================================================================== */
const cv = document.getElementById('pista');
const ctx = cv.getContext('2d');
const mini = document.getElementById('mapinha').getContext('2d');
let W = 0, H = 0;

const VOLTAS = 3;
let pontos = 0;
let estado = 'largada'; // largada | correndo | fim
let contagem = 3.5;
let cronometro = 0;

/* o traçado: pontos do meio da pista (uma curva fechada) */
const TRACADO = [
  [400, 1500], [400, 900], [520, 520], [900, 380], [1300, 420], [1500, 700], [1400, 1000], [1100, 1050],
  [1000, 1300], [1250, 1600], [1700, 1650], [2000, 1400], [2100, 900], [2000, 450], [2300, 250], [2700, 400],
  [2800, 1000], [2700, 1700], [2300, 2050], [1500, 2150], [800, 2100], [480, 1900]
];
const LARGURA_PISTA = 230;
let pontosPista = [];   // traçado suavizado
const caixas = [];      // caixas de item

const CORES = ['#e53935', '#1e88e5', '#43a047', '#fdd835', '#8e24aa', '#fb8c00'];
const NOMES = ['Você', 'Raio', 'Tufão', 'Faísca', 'Cometa', 'Trovão'];
let karts = [];
let jogador = null;
let manchas = [];   // óleo/banana na pista
let tiros = [];
let fumaca = [];
const camera = { x: 0, y: 0, ang: 0 };
const teclas = { esq: false, dir: false, acel: false, freio: false, usar: false };

function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [0, 1].map(i => 0.5 * ((2 * p1[i]) + (-p0[i] + p2[i]) * t + (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * t2 + (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * t3));
}
function montarPista() {
  pontosPista = [];
  const n = TRACADO.length;
  for (let i = 0; i < n; i++) {
    const p0 = TRACADO[(i - 1 + n) % n], p1 = TRACADO[i], p2 = TRACADO[(i + 1) % n], p3 = TRACADO[(i + 2) % n];
    for (let t = 0; t < 1; t += 0.1) pontosPista.push(catmull(p0, p1, p2, p3, t));
  }
  caixas.length = 0;
  for (let i = 15; i < pontosPista.length; i += 45) {
    const a = pontosPista[i], b = pontosPista[(i + 1) % pontosPista.length];
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) + Math.PI / 2;
    for (let k = -1; k <= 1; k++) caixas.push({ x: a[0] + Math.cos(ang) * k * 60, y: a[1] + Math.sin(ang) * k * 60, volta: 0 });
  }
}

/* o ponto mais perto do traçado: diz se está na pista e quanto já andou */
function maisPerto(x, y, dica) {
  let melhor = 1e9, idx = 0;
  const n = pontosPista.length;
  const de = dica == null ? 0 : dica - 30, ate = dica == null ? n : dica + 30;
  for (let k = de; k < ate; k++) {
    const i = (k + n) % n, p = pontosPista[i], d = (p[0] - x) ** 2 + (p[1] - y) ** 2;
    if (d < melhor) { melhor = d; idx = i; }
  }
  return { idx, dist: Math.sqrt(melhor) };
}

function novoKart(i) {
  const p = pontosPista[pontosPista.length - 6 - Math.floor(i / 2) * 7], q = pontosPista[pontosPista.length - 5 - Math.floor(i / 2) * 7];
  const ang = Math.atan2(q[1] - p[1], q[0] - p[0]);
  const lado = (i % 2 ? 1 : -1) * 45;
  return {
    id: i, nome: NOMES[i], cor: CORES[i], ia: i > 0,
    x: p[0] + Math.cos(ang + Math.PI / 2) * lado, y: p[1] + Math.sin(ang + Math.PI / 2) * lado,
    ang, vel: 0, velMax: i === 0 ? 560 : 500 + Math.random() * 60, giro: 0,
    derrape: 0, turbo: 0, carga: 0, rodando: 0, volta: 0, idx: 0, progresso: 0, terminou: false, tempoFinal: 0,
    item: null, mira: Math.random() * 40 - 20
  };
}

function comecar() {
  montarPista();
  karts = [];
  for (let i = 0; i < 6; i++) karts.push(novoKart(i));
  jogador = karts[0];
  karts.forEach(k => { const m = maisPerto(k.x, k.y); k.idx = m.idx; k.progresso = m.idx - pontosPista.length; });
  manchas = []; tiros = []; fumaca = [];
  pontos = 0; cronometro = 0; contagem = 3.5; estado = 'largada';
  document.getElementById('fim').classList.remove('ver');
}

/* ---------------- itens ---------------- */
const ITENS = ['turbo', 'banana', 'casco', 'turbo3', 'escudo'];
function pegarCaixa(k, c) {
  if (k.item || c.volta > cronometro) return;
  c.volta = cronometro + 4;
  const atras = posicaoDe(k) > 3;
  k.item = atras && Math.random() < 0.5 ? 'turbo3' : ITENS[Math.floor(Math.random() * (atras ? 5 : 3))];
  if (!k.ia) document.getElementById('item').textContent = 'Item: ' + nomeItem(k.item);
}
function nomeItem(i) { return { turbo: '🔥 Turbo', banana: '🍌 Banana', casco: '🐢 Casco', turbo3: '🔥🔥🔥 Turbo x3', escudo: '🛡 Escudo' }[i] || '—'; }
function usarItem(k) {
  if (!k.item) return;
  const it = k.item; k.item = null;
  if (it === 'turbo') k.turbo = 1.2;
  if (it === 'turbo3') { k.turbo = 1.2; k.item = 'turbo'; }
  if (it === 'banana') manchas.push({ x: k.x - Math.cos(k.ang) * 40, y: k.y - Math.sin(k.ang) * 40, tipo: 'banana' });
  if (it === 'casco') tiros.push({ x: k.x + Math.cos(k.ang) * 40, y: k.y + Math.sin(k.ang) * 40, vx: Math.cos(k.ang) * 900, vy: Math.sin(k.ang) * 900, vida: 3, dono: k.id });
  if (it === 'escudo') k.escudo = 5;
  if (!k.ia) { document.getElementById('item').textContent = 'Item: ' + nomeItem(k.item); pontos += 20; }
}
function rodar(k) {
  if (k.escudo > 0) { k.escudo = 0; return; }
  k.rodando = 1.1; k.vel *= 0.3;
  if (!k.ia) pontos = Math.max(0, pontos - 30);
}

/* ---------------- física ---------------- */
function atualizarKart(k, dt) {
  let esq = false, dir = false, acel = false, freio = false;
  if (k.ia) {
    /* a IA mira um ponto lá na frente do traçado */
    const alvo = pontosPista[(k.idx + 14) % pontosPista.length];
    const quer = Math.atan2(alvo[1] - k.y, alvo[0] - k.x);
    let d = quer - k.ang; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
    esq = d < -0.06; dir = d > 0.06; acel = true; freio = Math.abs(d) > 0.9 && k.vel > 300;
    if (k.item && Math.random() < dt * 0.5) usarItem(k);
  } else {
    esq = teclas.esq; dir = teclas.dir; acel = teclas.acel; freio = teclas.freio;
    if (teclas.usar) { usarItem(k); teclas.usar = false; }
  }
  if (estado !== 'correndo' || k.terminou) { acel = !k.terminou ? false : true; esq = dir = false; }
  if (k.rodando > 0) { k.rodando -= dt; k.ang += dt * 12; k.vel *= 0.96; return mover(k, dt); }

  const pista = maisPerto(k.x, k.y, k.idx);
  const naGrama = pista.dist > LARGURA_PISTA / 2;
  const max = k.velMax * (naGrama ? 0.45 : 1) * (k.turbo > 0 ? 1.45 : 1);
  if (acel) k.vel += (k.turbo > 0 ? 900 : 420) * dt; else k.vel -= 200 * dt;
  if (freio) k.vel -= 700 * dt;
  k.vel = Math.max(-120, Math.min(max, k.vel));
  if (k.vel > max) k.vel -= 600 * dt;

  const curva = (esq ? -1 : 0) + (dir ? 1 : 0);
  const derrapando = curva !== 0 && k.vel > 330 && (freio || k.derrape > 0);
  if (derrapando) { k.derrape += dt; k.carga += dt; if (!k.ia && Math.random() < 0.6) fumaca.push({ x: k.x, y: k.y, vida: 0.6, r: 6 }); }
  else {
    if (k.carga > 0.8) { k.turbo = Math.min(1.5, k.carga * 0.7); if (!k.ia) pontos += Math.round(k.carga * 50); }
    k.carga = 0; k.derrape = 0;
  }
  k.ang += curva * dt * (derrapando ? 3.4 : 2.6) * Math.min(1, Math.abs(k.vel) / 200);
  if (k.turbo > 0) k.turbo -= dt;
  if (k.escudo > 0) k.escudo -= dt;
  mover(k, dt);

  /* progresso na volta */
  const ant = k.idx;
  k.idx = pista.idx;
  const n = pontosPista.length;
  if (ant > n * 0.8 && k.idx < n * 0.2) { k.volta++; if (k.volta > VOLTAS) terminar(k); else if (!k.ia && k.volta > 1) pontos += 100; }
  if (ant < n * 0.2 && k.idx > n * 0.8) k.volta--;
  k.progresso = k.volta * n + k.idx;
}
function mover(k, dt) {
  k.x += Math.cos(k.ang) * k.vel * dt;
  k.y += Math.sin(k.ang) * k.vel * dt;
}
function terminar(k) {
  k.terminou = true; k.tempoFinal = cronometro;
  if (!k.ia) {
    const pos = karts.filter(o => o.terminou).length;
    pontos += [0, 1000, 600, 400, 250, 150, 100][pos];
    estado = 'fim';
    setTimeout(mostrarResultado, 1500);
  }
}
function posicaoDe(k) { return karts.slice().sort((a, b) => (b.terminou - a.terminou) || (a.terminou ? a.tempoFinal - b.tempoFinal : b.progresso - a.progresso)).indexOf(k) + 1; }

function atualizar(dt) {
  if (estado === 'largada') {
    contagem -= dt;
    document.getElementById('semaforo').textContent = contagem > 3 ? '' : contagem > 0 ? Math.ceil(contagem) : 'JÁ!';
    if (contagem <= 0) { estado = 'correndo'; setTimeout(() => document.getElementById('semaforo').textContent = '', 700); }
  } else if (estado === 'correndo') cronometro += dt;

  karts.forEach(k => atualizarKart(k, dt));
  /* batidas entre karts */
  for (let i = 0; i < karts.length; i++) for (let j = i + 1; j < karts.length; j++) {
    const a = karts[i], b = karts[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d > 0 && d < 36) { const p = (36 - d) / 2; a.x -= dx / d * p; a.y -= dy / d * p; b.x += dx / d * p; b.y += dy / d * p; a.vel *= 0.97; b.vel *= 0.97; }
  }
  karts.forEach(k => {
    caixas.forEach(c => { if (c.volta <= cronometro && Math.hypot(c.x - k.x, c.y - k.y) < 30) pegarCaixa(k, c); });
    for (let i = manchas.length - 1; i >= 0; i--) if (Math.hypot(manchas[i].x - k.x, manchas[i].y - k.y) < 26) { manchas.splice(i, 1); rodar(k); }
  });
  for (let i = tiros.length - 1; i >= 0; i--) {
    const t = tiros[i]; t.x += t.vx * dt; t.y += t.vy * dt; t.vida -= dt;
    const alvo = karts.find(k => k.id !== t.dono && Math.hypot(k.x - t.x, k.y - t.y) < 28);
    if (alvo) { rodar(alvo); if (t.dono === 0) pontos += 50; tiros.splice(i, 1); continue; }
    if (t.vida <= 0 || maisPerto(t.x, t.y).dist > LARGURA_PISTA / 2 + 30) tiros.splice(i, 1);
  }
  for (let i = fumaca.length - 1; i >= 0; i--) { fumaca[i].vida -= dt; fumaca[i].r += dt * 20; if (fumaca[i].vida <= 0) fumaca.splice(i, 1); }

  camera.x += (jogador.x - camera.x) * Math.min(1, dt * 6);
  camera.y += (jogador.y - camera.y) * Math.min(1, dt * 6);
  let da = jogador.ang - camera.ang; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
  camera.ang += da * Math.min(1, dt * 3);

  document.getElementById('posicao').textContent = posicaoDe(jogador) + 'º/6';
  document.getElementById('volta').textContent = 'Volta ' + Math.max(1, Math.min(VOLTAS, jogador.volta)) + '/' + VOLTAS;
  document.getElementById('tempo').textContent = formatar(cronometro);
  document.getElementById('pontosTxt').textContent = '★ ' + pontos;
}
function formatar(t) { const m = Math.floor(t / 60), s = (t % 60).toFixed(1); return m + ':' + (s < 10 ? '0' : '') + s; }

function mostrarResultado() {
  const ordem = karts.slice().sort((a, b) => (b.terminou - a.terminou) || (a.terminou ? a.tempoFinal - b.tempoFinal : b.progresso - a.progresso));
  document.getElementById('resultado').innerHTML = '<ol>' + ordem.map(k => '<li style="color:' + k.cor + '">' + k.nome + (k.terminou ? ' — ' + formatar(k.tempoFinal) : '') + '</li>').join('') + '</ol><p>Pontos da corrida: <b>' + pontos + '</b></p>';
  document.getElementById('fim').classList.add('ver');
}

/* ---------------- desenho ---------------- */
function redimensionar() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', redimensionar);

function desenhar() {
  ctx.fillStyle = '#3a8f3a'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(W / 2, H * 0.68);
  ctx.rotate(-camera.ang - Math.PI / 2);
  ctx.translate(-camera.x, -camera.y);
  /* zebra e asfalto */
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  traco(LARGURA_PISTA + 26, '#fff', [28, 28]);
  traco(LARGURA_PISTA + 26, '#d32f2f', [28, 28], 28);
  traco(LARGURA_PISTA, '#555');
  traco(4, 'rgba(255,255,255,.5)', [30, 40]);
  /* linha de chegada */
  const a = pontosPista[0], b = pontosPista[1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  ctx.save(); ctx.translate(a[0], a[1]); ctx.rotate(ang);
  for (let i = -6; i < 6; i++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (i + j) % 2 ? '#fff' : '#111'; ctx.fillRect(j * 18 - 18, i * 19, 18, 19); }
  ctx.restore();
  /* caixas, manchas, tiros, fumaça */
  caixas.forEach(c => { if (c.volta > cronometro) return; ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(cronometro * 2); ctx.fillStyle = '#ffca28'; ctx.fillRect(-13, -13, 26, 26); ctx.fillStyle = '#6d4c41'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 0, 1); ctx.restore(); });
  manchas.forEach(m => { ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(m.x, m.y, 10, 0, Math.PI * 2); ctx.fill(); });
  tiros.forEach(t => { ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(t.x, t.y, 11, 0, Math.PI * 2); ctx.fill(); });
  fumaca.forEach(f => { ctx.fillStyle = 'rgba(230,230,230,' + f.vida * 0.6 + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill(); });
  karts.forEach(desenharKart);
  ctx.restore();
  desenharMapinha();
}
function traco(larg, cor, tracejado, desloc) {
  ctx.strokeStyle = cor; ctx.lineWidth = larg; ctx.setLineDash(tracejado || []); ctx.lineDashOffset = desloc || 0;
  ctx.beginPath(); pontosPista.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke();
  ctx.setLineDash([]);
}
function desenharKart(k) {
  ctx.save(); ctx.translate(k.x, k.y); ctx.rotate(k.ang);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(-20, -12, 44, 28);
  ctx.fillStyle = '#222'; ctx.fillRect(-18, -16, 12, 6); ctx.fillRect(-18, 10, 12, 6); ctx.fillRect(10, -16, 12, 6); ctx.fillRect(10, 10, 12, 6);
  ctx.fillStyle = k.cor; ctx.fillRect(-20, -11, 42, 22);
  ctx.fillStyle = '#ffe0b2'; ctx.beginPath(); ctx.arc(-2, 0, 8, 0, Math.PI * 2); ctx.fill();
  if (k.turbo > 0) { ctx.fillStyle = '#ff9800'; ctx.fillRect(-32, -5, 12 + Math.random() * 8, 10); }
  if (k.carga > 0.8) { ctx.fillStyle = k.carga > 1.6 ? '#e040fb' : '#40c4ff'; ctx.fillRect(-26, -14, 4, 4); ctx.fillRect(-26, 10, 4, 4); }
  if (k.escudo > 0) { ctx.strokeStyle = '#80d8ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();
}
function desenharMapinha() {
  mini.clearRect(0, 0, 240, 180);
  const esc = 0.07;
  mini.strokeStyle = '#ddd'; mini.lineWidth = 6; mini.beginPath();
  pontosPista.forEach((p, i) => i ? mini.lineTo(p[0] * esc, p[1] * esc) : mini.moveTo(p[0] * esc, p[1] * esc)); mini.closePath(); mini.stroke();
  karts.forEach(k => { mini.fillStyle = k.cor; mini.beginPath(); mini.arc(k.x * esc, k.y * esc, k.ia ? 5 : 8, 0, Math.PI * 2); mini.fill(); });
}

/* ---------------- controles ---------------- */
const MAPA = { ArrowLeft: 'esq', KeyA: 'esq', ArrowRight: 'dir', KeyD: 'dir', ArrowUp: 'acel', KeyW: 'acel', ArrowDown: 'freio', KeyS: 'freio', Space: 'usar' };
addEventListener('keydown', e => { if (MAPA[e.code]) { teclas[MAPA[e.code]] = true; e.preventDefault(); } });
addEventListener('keyup', e => { if (MAPA[e.code] && MAPA[e.code] !== 'usar') teclas[MAPA[e.code]] = false; });
document.querySelectorAll('.bt').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); teclas[k] = true; b.classList.add('on'); });
  const solta = () => { if (k !== 'usar') teclas[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerup', solta); b.addEventListener('pointerleave', solta); b.addEventListener('pointercancel', solta);
});
document.getElementById('denovo').addEventListener('click', comecar);

let antes = performance.now();
function quadro(agora) {
  const dt = Math.min(0.04, (agora - antes) / 1000); antes = agora;
  atualizar(dt); desenhar();
  requestAnimationFrame(quadro);
}
redimensionar();
comecar();
requestAnimationFrame(quadro);
</script>
</body>
</html>
